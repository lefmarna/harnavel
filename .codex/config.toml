[features]
codex_hooks = true

[[hooks.Stop]]

[[hooks.Stop.hooks]]
type = "command"
command = 'mise exec -- node "$(git rev-parse --show-toplevel)/scripts/hooks/stop-verify.mjs"'

[mcp_servers.laravel-boost]
command = "docker"
args = ["compose", "exec", "app", "php", "artisan", "boost:mcp"]

[mcp_servers.laravel-boost.tools.search-docs]
approval_mode = "approve"
