[features]
codex_hooks = true

[[hooks.PostToolUse]]
matcher = "Write|Edit"

[[hooks.PostToolUse.hooks]]
type = "command"
command = 'mise exec -- node "$(git rev-parse --show-toplevel)/scripts/hooks/post-edit.mjs"'

[mcp_servers.laravel-boost]
command = "docker"
args = ["compose", "exec", "app", "php", "artisan", "boost:mcp"]

[mcp_servers.laravel-boost.tools.search-docs]
approval_mode = "approve"
