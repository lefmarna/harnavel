# workerの数（auto: コア数に合わせて設定）
worker_processes  auto;
worker_rlimit_nofile 40960;

# エラーログの出力先・crit: 致命的なエラー
error_log /dev/fd/1 crit;

# プロセスIDを格納するファイル
pid        /var/run/nginx.pid;

events {
    # epollが最適
    use epoll;
    # 1ワーカーあたりの接続数
    worker_connections  8192;
    # 複数リクエストを同時に受け付けるかどうか
    multi_accept on;
    # mutexが確保出来なかった際の待機時間
    accept_mutex_delay 100ms;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    # アクセスログの出力先
    access_log  /dev/fd/1  main;

    # 受け取れるPOSTデータの上限
    client_max_body_size 100m;
    # onすると早くなるが、不具合が起こることがあるためoff
    sendfile             off;
    # タイムアウトまでの時間
    keepalive_timeout    30;
    # レスポンスヘッダとファイルの内容をまとめて送る（パフォーマンス向上）
    tcp_nopush           on;
    # max: キャッシュの最大数・inactive: アクセスがないキャッシュの有効期限
    open_file_cache max=100 inactive=20s;

    # ファイルを圧縮する
    gzip  on;

    server {
        listen       80;
        server_name  _;

        root   /app/public;
        index  index.php index.html;

        location / {
            # この記述がないと、ルートディレクトリ以外が404になる
            try_files $uri $uri/ /index.php?$query_string;
            proxy_max_temp_file_size 0;
        }

        error_page   500 502 503 504  /error.html;
        location = /error.html {
            root   /app/public;
        }

        location ~ \.php$ {
            fastcgi_param HTTP_HOST $http_host;
            fastcgi_param HTTP_X_REAL_IP $remote_addr;
            fastcgi_param HTTP_X_FORWARDED_HOST $http_host;
            fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
            fastcgi_param HTTP_X_REMOTE_ADDR $remote_addr;
            fastcgi_pass   app:9000;
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            fastcgi_index  index.php;
            fastcgi_param  SCRIPT_FILENAME  $document_root$fastcgi_script_name;
            include        fastcgi_params;
        }

        location ~* .(jpg|jpeg|png|gif|ico|css|js)$ {
          expires     off;
          access_log  off;
        }
    }
}
