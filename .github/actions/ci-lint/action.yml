name: CI Lint
description: Install dependencies and run backend/frontend static checks (Pint, PHPStan, format, lint, types, docs).

runs:
  using: composite
  steps:
    - name: Setup mise
      uses: jdx/mise-action@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.5'
        tools: composer:v2

    - name: Get pnpm store directory
      id: pnpm-store
      shell: bash
      run: echo "path=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

    - name: Cache pnpm store
      uses: actions/cache@v5
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-

    - name: Cache Composer packages
      uses: actions/cache@v5
      with:
        path: ~/.composer/cache
        key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-composer-

    - name: Install Dependencies
      shell: bash
      run: |
        composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
        pnpm install --frozen-lockfile

    - name: Run Pint
      shell: bash
      run: vendor/bin/pint --test

    - name: Cache PHPStan result cache
      uses: actions/cache@v5
      with:
        path: /tmp/phpstan
        key: ${{ runner.os }}-phpstan-php-8.5-${{ hashFiles('composer.lock', 'phpstan.neon.dist') }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-phpstan-php-8.5-${{ hashFiles('composer.lock', 'phpstan.neon.dist') }}-
          ${{ runner.os }}-phpstan-php-8.5-
          ${{ runner.os }}-phpstan-

    - name: Run Static Analysis
      shell: bash
      run: composer analyse

    - name: Check Frontend Formatting
      shell: bash
      run: pnpm run format:check

    - name: Generate Wayfinder Files
      shell: bash
      run: |
        cp .env.example .env
        php artisan key:generate
        php artisan wayfinder:generate --with-form

    - name: Lint Frontend
      shell: bash
      run: pnpm run lint:check

    - name: Type Check Frontend
      shell: bash
      run: pnpm run types:check

    - name: Lint Markdown Links
      shell: bash
      run: pnpm run lint:docs

    - name: Test Deploy Rsync Excludes
      shell: bash
      run: pnpm run test:deploy-rsync-excludes
