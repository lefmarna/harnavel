# SHA で固定した Actions と Composer 依存を古いまま放置しない。
# npm は pnpm の minimumReleaseAge と Dependabot の相性が悪いため、手動の pnpm update と CI の pnpm audit に任せる。
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    groups:
      composer:
        patterns: ["*"]
