name: audit

# 依存関係の脆弱性アドバイザリを検知する唯一の経路（TADR-0001）。判定は advisory
# データベースというリポジトリ外の可変状態に依存し、コードが変わらなくても結果が変わるため、
# マージやデプロイのゲートには置かず、ここで日次に観測して失敗＝通知として扱う。
# 依存のインストールは不要（composer audit --locked と pnpm audit は lockfile を読む）。
# Composer と pnpm は独立したジョブにする。片方に未解決の advisory が残っている間も、
# もう片方の監査が止まらないようにするため。
#
# 唯一の経路なので、静かに止まると検知がゼロになる。GitHub はリポジトリが一定期間無活動だと
# schedule を自動停止するため、実行実績を時折確認すること（gh run list --workflow=audit.yml）。

on:
  workflow_dispatch:
  schedule:
    # 毎日 07:00 JST（= 22:00 UTC）。
    - cron: '0 22 * * *'

permissions:
  contents: read

jobs:
  composer:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2

      - name: Audit Composer lockfile
        run: composer audit --locked

  pnpm:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup mise
        uses: jdx/mise-action@v4

      - name: Audit pnpm production dependencies
        run: pnpm audit --prod
