name: audit

# 依存関係の脆弱性アドバイザリを検知する唯一の経路（TADR-0001）。判定は advisory
# データベースというリポジトリ外の可変状態に依存し、コードが変わらなくても結果が変わるため、
# マージやデプロイのゲートには置かず、ここで日次に観測して失敗＝通知として扱う。
# 依存のインストールは不要（composer audit --locked と pnpm audit は lockfile を読む）。
# Composer と pnpm は独立したジョブにする。片方に未解決の advisory が残っている間も、
# もう片方の監査が止まらないようにするため。
#
# 唯一の経路なので、静かに止まると検知がゼロになる。GitHub はリポジトリが一定期間無活動だと
# schedule を自動停止するため、実行実績を時折確認すること（gh run list --workflow=audit.yml）。
#
# 監査対象は delivery.yml がデプロイするブランチすべて。schedule はデフォルトブランチでしか
# 起動せず checkout も既定ではその 1 本だけなので、明示的に ref を切り替えないと develop の
# lockfile は main へマージされるまで一度も監査されない（派生アプリで develop が main より
# 177 コミット先行し、main の最終更新が 2 か月以上前という実測がある）。両者のブランチ集合が
# ずれないよう scripts/test-deploy-lifecycle.ts が突き合わせる。
# develop を持たないアプリもあるため、実在しない ref はジョブを失敗させずに飛ばす。
# 唯一の検知経路が常時赤だと通知そのものが無視されるようになる。

on:
  workflow_dispatch:
  schedule:
    # 毎日 07:00 JST（= 22:00 UTC）。
    - cron: '0 22 * * *'

permissions:
  contents: read

jobs:
  composer:
    runs-on: ubuntu-latest

    strategy:
      # 片方のブランチの advisory がもう片方の監査を止めない。Composer と pnpm を
      # 独立ジョブにしているのと同じ理由。
      fail-fast: false
      matrix:
        ref: [main, develop]

    steps:
      - uses: actions/checkout@v6

      - name: Check out ${{ matrix.ref }}
        id: ref
        run: |
          # ref は refs/heads/ で完全修飾する。未修飾だと ls-remote のパターンが
          # feature/${{ matrix.ref }} にも一致し、fetch は同名タグ（refs/tags/）を
          # ブランチより先に解決するため、別の ref の lockfile を監査し得る。
          #
          # --exit-code の 2 だけが「一致する ref なし」。認証・DNS・通信・GitHub 側の
          # 障害も非ゼロを返すので、それらを不在として扱うと、唯一の検知経路が動かなかった
          # 日に workflow が成功してしまう。2 以外は失敗させる。
          status=0
          git ls-remote --exit-code --heads origin "refs/heads/${{ matrix.ref }}" >/dev/null || status=$?

          if [ "$status" -eq 0 ]; then
            git fetch --depth=1 origin "refs/heads/${{ matrix.ref }}"
            git checkout --detach FETCH_HEAD
            echo "present=true" >> "$GITHUB_OUTPUT"
          elif [ "$status" -eq 2 ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::branch ${{ matrix.ref }} does not exist here; nothing to audit"
          else
            echo "::error::could not determine whether ${{ matrix.ref }} exists (git ls-remote exited ${status}); refusing to report a clean audit" >&2
            exit "$status"
          fi

      - name: Setup PHP
        if: steps.ref.outputs.present == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2

      - name: Audit Composer lockfile
        if: steps.ref.outputs.present == 'true'
        run: composer audit --locked

  pnpm:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        ref: [main, develop]

    steps:
      - uses: actions/checkout@v6

      - name: Check out ${{ matrix.ref }}
        id: ref
        run: |
          # ref は refs/heads/ で完全修飾する。未修飾だと ls-remote のパターンが
          # feature/${{ matrix.ref }} にも一致し、fetch は同名タグ（refs/tags/）を
          # ブランチより先に解決するため、別の ref の lockfile を監査し得る。
          #
          # --exit-code の 2 だけが「一致する ref なし」。認証・DNS・通信・GitHub 側の
          # 障害も非ゼロを返すので、それらを不在として扱うと、唯一の検知経路が動かなかった
          # 日に workflow が成功してしまう。2 以外は失敗させる。
          status=0
          git ls-remote --exit-code --heads origin "refs/heads/${{ matrix.ref }}" >/dev/null || status=$?

          if [ "$status" -eq 0 ]; then
            git fetch --depth=1 origin "refs/heads/${{ matrix.ref }}"
            git checkout --detach FETCH_HEAD
            echo "present=true" >> "$GITHUB_OUTPUT"
          elif [ "$status" -eq 2 ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::branch ${{ matrix.ref }} does not exist here; nothing to audit"
          else
            echo "::error::could not determine whether ${{ matrix.ref }} exists (git ls-remote exited ${status}); refusing to report a clean audit" >&2
            exit "$status"
          fi

      - name: Setup mise
        if: steps.ref.outputs.present == 'true'
        uses: jdx/mise-action@v4

      - name: Audit pnpm production dependencies
        if: steps.ref.outputs.present == 'true'
        run: pnpm audit --prod
