name: check

on:
  push:
    branches-ignore:
      - develop
      - main

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/ci-lint

      - name: Run Frontend Unit Tests
        run: pnpm run test:unit
