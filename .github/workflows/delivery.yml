name: delivery

on:
  push:
    branches:
      - develop
      - main

concurrency:
  group: delivery-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  provenance:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
      pull-requests: read
    outputs:
      tree: ${{ steps.lookup.outputs.tree }}
      artifact: ${{ steps.lookup.outputs.artifact }}
      verified-run: ${{ steps.lookup.outputs.verified-run }}

    steps:
      # 認証できなくても CircleCI の E2E を確認できないだけなので、未検証として扱う。
      - name: Authenticate to Google Cloud
        if: vars.E2E_RECORD_BUCKET != ''
        continue-on-error: true
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}

      - name: Find a verified build of this tree
        id: lookup
        env:
          GH_TOKEN: ${{ github.token }}
          E2E_RECORD_BUCKET: ${{ vars.E2E_RECORD_BUCKET }}
        run: |
          tree=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$GITHUB_SHA" --jq .tree.sha)
          echo "tree=$tree" >> "$GITHUB_OUTPUT"

          # 照会に失敗したら未検証として扱う。
          merged=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            --jq ".[] | select(.merge_commit_sha == \"$GITHUB_SHA\") | \"\(.number) \(.head.sha)\"") || merged=
          merged_head=
          if [ -n "$merged" ]; then
            read -r number head <<< "$merged"
            # base を差し替えた PR の run は、別ブランチのワークフローで動いた可能性がある。
            if base_changes=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$number/events" \
              --jq '.[] | select(.event == "base_ref_changed") | .id') && [ -z "$base_changes" ]; then
              merged_head=$head
            fi
          fi

          find_run() {
            runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$1&per_page=100" \
              --jq '.artifacts[] | select(.expired | not) | .workflow_run.id') || return 0

            for run in $runs; do
              meta=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq '
                select(
                  .status == "completed" and .conclusion == "success" and
                  .head_repository.id == .repository.id and
                  (.path == ".github/workflows/quality.yml" or .path == ".github/workflows/delivery.yml")
                ) | "\(.event) \(.head_sha) \(.html_url)"') || meta=
              [ -n "$meta" ] || continue
              read -r event head_sha url <<< "$meta"

              # 成果物名は実行したワークフローが自由に決められるため、run の実行元でも照合する。
              if [ "$event" = pull_request ]; then
                [ -n "$merged_head" ] && [ "$head_sha" = "$merged_head" ] || continue
              else
                run_tree=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$head_sha" --jq .tree.sha) || continue
                [ "$run_tree" = "$tree" ] || continue
              fi

              echo "$run $url"
              return 0
            done
          }

          artifact=build-$tree
          found=$(find_run "$artifact")

          # E2E を CircleCI に任せたビルドは、同じツリーの E2E 成功記録を読めたときだけ検証済みとする。
          if [ -z "$found" ] && [ -n "$E2E_RECORD_BUCKET" ]; then
            found=$(find_run "build-$tree-needs-e2e")
            if [ -n "$found" ] &&
              proof=$(gcloud storage cat "gs://$E2E_RECORD_BUCKET/$GITHUB_REPOSITORY/e2e/$tree.json") &&
              [ "$(jq -r .tree <<< "$proof")" = "$tree" ] &&
              [ "$(jq -r .repository <<< "$proof")" = "$GITHUB_REPOSITORY" ]; then
              artifact=build-$tree-needs-e2e
              e2e=" and E2E in $(jq -r .build <<< "$proof")"
            else
              found=
            fi
          fi
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"

          if [ -z "$found" ]; then
            echo "No verified build of tree $tree; running lint and tests." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          read -r run url <<< "$found"
          echo "verified-run=$run" >> "$GITHUB_OUTPUT"
          echo "Tree $tree passed lint and tests in $url${e2e:-}; deploying its build." >> "$GITHUB_STEP_SUMMARY"

  quality:
    needs: provenance
    if: needs.provenance.outputs.verified-run == ''
    uses: ./.github/workflows/reusable-quality.yml

  deploy:
    runs-on: ubuntu-latest
    needs: [provenance, quality]
    # 検証済みのツリーでも、この run のゲートが失敗したら配備しない。
    if: >-
      !cancelled() && needs.provenance.result == 'success' &&
      (needs.quality.result == 'success' ||
      (needs.provenance.outputs.verified-run != '' && needs.quality.result == 'skipped'))
    permissions:
      actions: read
      contents: read
    environment: ${{ github.ref_name == 'main' && 'Production' || 'Develop' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate deployment configuration
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          node -e '
            const raw = process.env.HEALTHCHECK_URL ?? ""
            try {
              const url = new URL(raw)
              if (
                url.protocol === "https:" &&
                url.pathname === "/up" &&
                url.username === "" &&
                url.password === "" &&
                url.search === "" &&
                url.hash === "" &&
                url.href === raw
              ) process.exit(0)
            } catch {}
            process.exit(1)
          ' || {
            echo "HEALTHCHECK_URL must be a canonical HTTPS URL ending in /up." >&2
            exit 1
          }

      # トークンがなければ run-id は無視され、この run から取得する。
      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.provenance.outputs.artifact }}
          path: public/build/
          github-token: ${{ needs.provenance.outputs.verified-run && github.token || '' }}
          run-id: ${{ needs.provenance.outputs.verified-run || github.run_id }}

      # 再利用したビルドも E2E まで検証済みの名前で残し、同じツリーのリリースで再検証しない。
      - name: Keep the reused build for releases
        if: needs.provenance.outputs.verified-run != ''
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ needs.provenance.outputs.tree }}
          path: public/build/
          retention-days: 3

      - name: Check release-critical files
        run: |
          test -f public/build/manifest.json
          test -f public/opengraph-image.jpg
          node --input-type=module -e '
            import { existsSync, readFileSync } from "node:fs"
            const root = "public/build/"
            const entries = Object.values(JSON.parse(readFileSync(root + "manifest.json", "utf8")))
            if (entries.length === 0) throw new Error("Vite manifest is empty")
            const files = entries.flatMap((entry) => [
              entry.file,
              ...(entry.css ?? []),
              ...(entry.assets ?? []),
            ]).filter((file) => typeof file === "string")
            const missing = files.filter((file) => !existsSync(root + file))
            if (missing.length > 0) throw new Error("Vite assets missing: " + missing.join(", "))
          '

      - name: Create deployment package
        env:
          XSERVER_USER: ${{ secrets.XSERVER_USER }}
        run: |
          mkdir -p .deploy
          rsync -av --exclude-from='.deployignore' ./ .deploy/

          if [ "$GITHUB_REF_NAME" = "develop" ]; then
            test -f .htaccess.develop
            cp .htaccess.develop .deploy/.htaccess
            if [[ -z "${XSERVER_USER:-}" ]]; then
              echo "XSERVER_USER is required." >&2
              exit 1
            fi
            if [[ ! "$XSERVER_USER" =~ ^[a-z][a-z0-9]{2,11}$ ]]; then
              echo "XSERVER_USER must be a valid XServer server ID." >&2
              exit 1
            fi
            if ! grep -Fq '{XSERVER_USER}' .deploy/.htaccess; then
              echo "Deployment .htaccess is missing {XSERVER_USER}." >&2
              exit 1
            fi
            sed -i "s/{XSERVER_USER}/${XSERVER_USER}/g" .deploy/.htaccess
            printf 'User-agent: *\nDisallow: /\n' > .deploy/public/robots.txt
            rm -f .deploy/public/sitemap.xml
          fi

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.XSERVER_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          test -n "${{ secrets.XSERVER_KNOWN_HOSTS }}"
          printf '%s\n' "${{ secrets.XSERVER_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts

      - name: Verify XServer toolchain
        run: |
          for attempt in 1 2 3; do
            if ssh -p 10022 -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
              ${{ secrets.XSERVER_USER }}@${{ secrets.XSERVER_HOST }} \
              "test -x /usr/bin/php8.5 && \
              test -r ~/opt/bin/composer-2.10.2 && \
              composer_version=\$(/usr/bin/php8.5 ~/opt/bin/composer-2.10.2 --version --no-ansi) && \
              printf '%s\n' \"\$composer_version\" && \
              printf '%s\n' \"\$composer_version\" | grep -Eq '^Composer version 2\.10\.2([[:space:]]|$)'"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep "$((attempt * 30))"
            fi
          done
          exit 1

      - name: Enable maintenance mode
        env:
          DEPLOY_DIRECTORY: ${{ secrets.DEPLOY_DIRECTORY }}
        run: |
          for attempt in 1 2 3; do
            if ssh -p 10022 -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
              ${{ secrets.XSERVER_USER }}@${{ secrets.XSERVER_HOST }} \
              "mkdir -p -- \"$DEPLOY_DIRECTORY\" && \
              if [ -f \"$DEPLOY_DIRECTORY/artisan\" ] && [ -r \"$DEPLOY_DIRECTORY/vendor/autoload.php\" ]; then \
                cd -- \"$DEPLOY_DIRECTORY\" && \
                { /usr/bin/php8.5 artisan down --render='errors::503' --retry=60 || :; } && \
                [ -s storage/framework/down ] && \
                [ -r storage/framework/maintenance.php ] && \
                [ -r vendor/laravel/framework/src/Illuminate/Foundation/Console/stubs/maintenance-mode.stub ] && \
                cmp -s storage/framework/maintenance.php vendor/laravel/framework/src/Illuminate/Foundation/Console/stubs/maintenance-mode.stub && \
                /usr/bin/php8.5 -r '\$data = json_decode(file_get_contents(\$argv[1]), true); exit(is_array(\$data) && (\$data[\"except\"] ?? null) === [\"/up\"] && is_string(\$data[\"template\"] ?? null) && \$data[\"template\"] !== \"\" && (\$data[\"status\"] ?? null) === 503 && (\$data[\"retry\"] ?? null) === 60 && (\$data[\"redirect\"] ?? null) === null && (\$data[\"refresh\"] ?? null) === null && (\$data[\"secret\"] ?? null) === null ? 0 : 1);' storage/framework/down; \
              fi"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep "$((attempt * 30))"
            fi
          done
          exit 1

      - name: Deploy to XServer via Rsync
        env:
          DEPLOY_DIRECTORY: ${{ secrets.DEPLOY_DIRECTORY }}
        run: |
          ssh_opts="ssh -p 10022 -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=4"
          for attempt in 1 2 3; do
            if rsync -avz --delete --timeout=60 \
              -e "$ssh_opts" \
              --exclude='.env' \
              --exclude='.user.ini' \
              --exclude='/public/storage' \
              --exclude='/vendor' \
              --exclude='storage/app/private/**' \
              --exclude='storage/app/public/**' \
              --exclude='storage/logs/*' \
              --exclude='storage/framework/cache/data/*' \
              --exclude='/storage/framework/down' \
              --exclude='/storage/framework/maintenance.php' \
              --exclude='storage/framework/sessions/*' \
              --exclude='storage/framework/views/*' \
              --exclude='dev.example.com' \
              .deploy/ "${{ secrets.XSERVER_USER }}@${{ secrets.XSERVER_HOST }}:$DEPLOY_DIRECTORY/"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep "$((attempt * 30))"
            fi
          done
          exit 1

      - name: Run post-deploy commands
        env:
          DEPLOY_DIRECTORY: ${{ secrets.DEPLOY_DIRECTORY }}
        run: |
          # 途中で失敗した migration の再実行で部分変更や後続エラーを増やさないよう、サーバ上の失敗は再試行しない。
          # PHP は致命的エラーでも 255 を返すため、サーバ上の失敗は || exit 1 で 1 にそろえる。
          # 再試行するのは SSH が終了コード 255 を返した場合だけ。実行途中の通信切断も含むため、
          # コマンドが再実行される可能性は残る。
          for attempt in 1 2 3; do
            status=0
            ssh -p 10022 -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
              ${{ secrets.XSERVER_USER }}@${{ secrets.XSERVER_HOST }} \
              "cd -- \"$DEPLOY_DIRECTORY\" && \
              /usr/bin/php8.5 ~/opt/bin/composer-2.10.2 install --no-dev --no-interaction --optimize-autoloader && \
              /usr/bin/php8.5 artisan down --render='errors::503' --retry=60 && \
              [ -s storage/framework/down ] && \
              [ -r storage/framework/maintenance.php ] && \
              [ -r vendor/laravel/framework/src/Illuminate/Foundation/Console/stubs/maintenance-mode.stub ] && \
              cmp -s storage/framework/maintenance.php vendor/laravel/framework/src/Illuminate/Foundation/Console/stubs/maintenance-mode.stub && \
              /usr/bin/php8.5 -r '\$data = json_decode(file_get_contents(\$argv[1]), true); exit(is_array(\$data) && (\$data[\"except\"] ?? null) === [\"/up\"] && is_string(\$data[\"template\"] ?? null) && \$data[\"template\"] !== \"\" && (\$data[\"status\"] ?? null) === 503 && (\$data[\"retry\"] ?? null) === 60 && (\$data[\"redirect\"] ?? null) === null && (\$data[\"refresh\"] ?? null) === null && (\$data[\"secret\"] ?? null) === null ? 0 : 1);' storage/framework/down && \
              /usr/bin/php8.5 artisan config:cache && \
              /usr/bin/php8.5 artisan route:cache && \
              /usr/bin/php8.5 artisan view:cache && \
              /usr/bin/php8.5 artisan migrate --force || exit 1" || status=$?
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            if [ "$status" -ne 255 ]; then
              echo "::error title=Post-deploy commands failed::A command failed on the server; this attempt was not retried. Maintenance mode was not automatically disabled. Inspect the error above and repair any partial database changes before redeploying." >&2
              exit 1
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep "$((attempt * 30))"
            fi
          done
          exit 1

      - name: Wait for OPcache revalidation
        run: sleep 2

      - name: Disable maintenance mode
        env:
          DEPLOY_DIRECTORY: ${{ secrets.DEPLOY_DIRECTORY }}
        run: |
          for attempt in 1 2 3; do
            if ssh -p 10022 -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
              ${{ secrets.XSERVER_USER }}@${{ secrets.XSERVER_HOST }} \
              "cd -- \"$DEPLOY_DIRECTORY\" && /usr/bin/php8.5 artisan up"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep "$((attempt * 30))"
            fi
          done
          exit 1

      - name: Verify release health
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
          HEALTHCHECK_BASIC_AUTH: ${{ secrets.HEALTHCHECK_BASIC_AUTH }}
        run: |
          auth=()
          if [ -n "${HEALTHCHECK_BASIC_AUTH:-}" ]; then
            auth=(--user "$HEALTHCHECK_BASIC_AUTH")
          fi

          for attempt in 1 2 3; do
            status=$(
              curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
                --connect-timeout 5 --max-time 5 \
                "${auth[@]}" "$HEALTHCHECK_URL"
            ) || status=

            if [ "$status" = "200" ]; then
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              sleep 1
            fi
          done

          echo "Release health check failed: $HEALTHCHECK_URL returned ${status:-no response}." >&2
          exit 1
