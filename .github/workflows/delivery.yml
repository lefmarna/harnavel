name: delivery

on:
  push:
    branches:
      - develop
      - main

concurrency:
  group: delivery-${{ github.ref }}
  # maintenance mode 中の実行を新しい push で中断しない。
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/ci-lint

  test:
    needs: lint
    uses: ./.github/workflows/reusable-test.yml
    with:
      upload-artifacts: true

  deploy:
    runs-on: ubuntu-latest
    needs: test
    # Each environment must define its own XSERVER_*, DEPLOY_DIRECTORY, and HEALTHCHECK_URL secrets.
    environment: ${{ github.ref_name == 'main' && 'Production' || 'Develop' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # HEALTHCHECK_URL が health check を通り得ない値のままだと、サーバー更新と maintenance
      # 解除まで進んでから初めて落ち、正常なリリースを 503 へ引き戻すことになる。
      # 「検証を通らない値はリモートへ触れる前に fail する」契約を守るため、grep ではなく
      # WHATWG URL パーサー（runner 標準の Node）で検証する。grep は行単位マッチのため末尾
      # 改行付きの値を通し、範囲外ポートや空白も curl の拒否と一致しない。
      # https スキームのみ許可する: .htaccess / .htaccess.develop は %{HTTPS} off を無条件に
      # 301 するため、http URL は health check が追従しない 301 を受けて必ず失敗し、健全な
      # リリースを withdraw させる。オリジン導出を壊す userinfo / query / fragment も禁止する
      # （https://example.com#probe を通すと、アセット URL がルートページへ化けて検証が骨抜き
      # になる）。href と一致する canonical 形だけを受理する。
      - name: Validate deployment configuration
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          node -e '
            const raw = process.env.HEALTHCHECK_URL ?? ""
            let url
            try {
              url = new URL(raw)
            } catch {
              process.exit(1)
            }
            const ok =
              url.protocol === "https:" &&
              url.username === "" &&
              url.password === "" &&
              url.search === "" &&
              url.hash === "" &&
              !raw.includes("?") &&
              !raw.includes("#") &&
              // 到達性プローブは PHP を必ず通さなければならない。パスは
              // bootstrap/app.php の health ルート（health: "/up"）と厳密に一致させる。
              // 静的ファイル（/manifest.webmanifest など）を指すと、PHP-FPM や Laravel が
              // 起動できなくてもアセットと合わせて 200 が揃い、壊れたリリースが withdraw
              // されずに公開されたままになる。末尾一致では /static/up のような静的パスを
              // 通してしまうため、完全一致で判定する。health ルートを移したアプリは
              // ここも同時に変える。
              url.pathname === "/up" &&
              (url.href === raw || url.href === raw + "/")
            process.exit(ok ? 0 : 1)
          ' || {
            echo "HEALTHCHECK_URL environment secret is required and must be a canonical absolute https URL with a host and no whitespace, userinfo, query, or fragment, whose path is exactly the Laravel health route '/up' (e.g. https://example.com/up). A subpath such as /health/up is rejected: it must reach PHP, and a static path would let verification pass while the application cannot boot. Use the canonical host: redirects are not followed, so an http URL or a host that redirects (such as www when www redirects to the apex) fails verification." >&2
            exit 1
          }

      # テストジョブでビルドした成果物をダウンロード
      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          name: build
          path: public/build/

      # 対象ファイルのリストはアプリ較正（TADR-0003: delivery.yml は Tier 2）
      - name: Check release-critical files
        run: |
          missing=0
          for f in public/build/manifest.json public/opengraph-image.jpg; do
            if [ ! -f "$f" ]; then
              echo "::error::Release-critical file missing: $f"
              missing=1
            fi
          done
          [ $missing -eq 0 ] || exit 1

      - name: Create deployment package
        run: |
          mkdir -p .deploy
          rsync -av --exclude-from='.deployignore' ./ .deploy/

          # develop環境では .htaccess.develop を使用
          if [ "${{ github.ref_name }}" = "develop" ]; then
            test -f .htaccess.develop || { echo '.htaccess.develop is missing' >&2; exit 1; }
            cp .htaccess.develop .deploy/.htaccess

            # develop環境は検索エンジンに公開しない
            printf 'User-agent: *\nDisallow: /\n' > .deploy/public/robots.txt
            rm -f .deploy/public/sitemap.xml
          fi

      # SSH設定（XSERVER_KNOWN_HOSTSを必須にしてknown_hostsへ登録）
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.XSERVER_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          if [ -z "${{ secrets.XSERVER_KNOWN_HOSTS }}" ]; then
            echo "XSERVER_KNOWN_HOSTS is required" >&2
            exit 1
          fi
          printf '%s\n' "${{ secrets.XSERVER_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts

      # PHP/Composer を実際に起動して、破壊的な rsync より前に未配置・破損・版違いを検出する。
      - name: Verify XServer toolchain
        run: |
          for attempt in 1 2 3; do
            if ssh -p 10022 -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
              ${{ secrets.XSERVER_USER }}@${{ secrets.XSERVER_HOST }} \
              "test -x /usr/bin/php8.5 && \
              test -r ~/opt/bin/composer-2.10.2 && \
              composer_version=\$(/usr/bin/php8.5 ~/opt/bin/composer-2.10.2 --version --no-ansi) && \
              printf '%s\n' \"\$composer_version\" && \
              printf '%s\n' \"\$composer_version\" | grep -Eq '^Composer version 2\.10\.2([[:space:]]|$)'"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "toolchain preflight ssh attempt ${attempt} failed; retrying in $((attempt * 30))s..." >&2
              sleep "$((attempt * 30))"
            fi
          done
          echo "XServer toolchain preflight failed after 3 attempts" >&2
          exit 1

      - name: Enable maintenance mode
        env:
          DEPLOY_DIRECTORY: ${{ secrets.DEPLOY_DIRECTORY }}
        run: |
          for attempt in 1 2 3; do
            if ssh -p 10022 -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
              ${{ secrets.XSERVER_USER }}@${{ secrets.XSERVER_HOST }} \
              "mkdir -p -- \"$DEPLOY_DIRECTORY\" && \
              cd -- \"$DEPLOY_DIRECTORY\" && \
              /usr/bin/php8.5" < .github/deploy/enable-maintenance.php; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "maintenance down ssh attempt ${attempt} failed; retrying in $((attempt * 30))s..." >&2
              sleep "$((attempt * 30))"
            fi
          done
          echo "failed to enable maintenance mode after 3 attempts" >&2
          exit 1

      # maintenance mode は入口の新規リクエストだけを止める。破壊的な rsync より前に、
      # 既存の同期リクエストが旧リリースだけで完了するまで待つ。
      # 120秒はテンプレート既定値。最長同期リクエストを上回る値へアプリごとに較正する。
      - name: Drain in-flight requests
        run: sleep 120

      # rsync除外の方針:
      # - .deployignore: ローカルパッケージ作成時の除外（開発用ファイル等）
      # - rsync --exclude: サーバー側の既存データ保護（.env, storage, サブドメイン等）
      # vendor は --delete で消さずに保持する。post-deploy の composer install --no-dev が
      # Composer 管理対象を composer.lock と整合させる。削除すると install 完了までサイトが
      # vendor 無しで停止する。maintenance mode の状態と bootstrap 非依存の503応答も転送中は保持する。
      # XServerへのSSH接続は稀に瞬断・スロットリングで失敗するため、
      # 接続タイムアウトを短めにして指数バックオフでリトライする。
      - name: Deploy to XServer via Rsync
        env:
          DEPLOY_DIRECTORY: ${{ secrets.DEPLOY_DIRECTORY }}
        run: |
          ssh_opts="ssh -p 10022 -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=4"
          for attempt in 1 2 3; do
            if rsync -avz --delete --timeout=60 \
              -e "$ssh_opts" \
              --exclude='.env' \
              --exclude='.user.ini' \
              --exclude='/vendor' \
              --exclude='storage/app/private/**' \
              --exclude='storage/app/public/**' \
              --exclude='storage/logs/*' \
              --exclude='storage/framework/cache/data/*' \
              --exclude='/storage/framework/down' \
              --exclude='/storage/framework/maintenance.php' \
              --exclude='storage/framework/sessions/*' \
              --exclude='storage/framework/views/*' \
              --exclude='dev.laravel-app-template.com' \
              .deploy/ "${{ secrets.XSERVER_USER }}@${{ secrets.XSERVER_HOST }}:$DEPLOY_DIRECTORY/"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "rsync attempt ${attempt} failed; retrying in $((attempt * 30))s..." >&2
              sleep "$((attempt * 30))"
            fi
          done
          echo "rsync failed after 3 attempts" >&2
          exit 1

      - name: Run Post-Deploy Commands
        env:
          DEPLOY_DIRECTORY: ${{ secrets.DEPLOY_DIRECTORY }}
        run: |
          for attempt in 1 2 3; do
            if ssh -p 10022 -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
              ${{ secrets.XSERVER_USER }}@${{ secrets.XSERVER_HOST }} \
              "cd $DEPLOY_DIRECTORY && \
              /usr/bin/php8.5 ~/opt/bin/composer-2.10.2 install --no-dev --no-interaction --optimize-autoloader && \
              /usr/bin/php8.5 artisan config:cache && \
              /usr/bin/php8.5 artisan route:cache && \
              /usr/bin/php8.5 artisan view:cache && \
              /usr/bin/php8.5 artisan migrate --force"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "post-deploy ssh attempt ${attempt} failed; retrying in $((attempt * 30))s..." >&2
              sleep "$((attempt * 30))"
            fi
          done
          echo "post-deploy ssh failed after 3 attempts" >&2
          exit 1

      # Web SAPI の OPcache はファイル更新を opcache.revalidate_freq 秒に一度しか見に行かない。
      # rsync 直後は旧バイトコードが応答し得るので、migrate 済みの新スキーマに対して旧コードが
      # 走る窓ができる。**必ず maintenance 解除より前にここで待つ**: 解除後に待つと、その窓に
      # 実ユーザーのリクエストが入る（計画503が守っているのは解除までの区間だけ）。
      # 10 秒は XServer 実測（revalidate_freq = 2）に対する余裕込みの値で、アプリ較正ではない。
      # 受入条件は revalidate_freq <= 10（docs/infrastructure.md の OPcache Revalidation）。
      # 検証側は解除直後にそのまま probe する（scripts/verify-release-health.mjs は待たない）。
      - name: Wait for OPcache revalidation
        run: sleep 10

      # 「maintenance 解除をこれから試行する」事実を no-op の成功として記録する。
      # Withdraw unhealthy release は解除ステップ自体の outcome ではなくこのマーカーを
      # 条件にする。リモートで artisan up とファイル削除が完了した直後に SSH 切断や
      # キャンセルが起きると、サイトは公開済みでも解除ステップの outcome は
      # failure / cancelled になり、成功条件では未検証リリースが取り残されるため。
      # settle をこのマーカーより前に置くのは、待機中のキャンセルで maintenance を
      # そのまま維持するため（マーカー以降のキャンセルは withdraw 経路に入る）。
      - name: Mark maintenance lift attempt
        id: maintenance-lift-attempt
        run: echo "maintenance lift will be attempted; an unverified release is withdrawn from here on"

      # 途中失敗時は壊れたリリースを公開せず、再実行または手動復旧まで maintenance mode を保つ。
      # standalone responder は設定された maintenance driver に依存せず書かれるため、
      # artisan up の後にも明示的に削除し、残留していないことを確認する。
      - name: Disable maintenance mode
        env:
          DEPLOY_DIRECTORY: ${{ secrets.DEPLOY_DIRECTORY }}
        run: |
          for attempt in 1 2 3; do
            if ssh -p 10022 -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
              ${{ secrets.XSERVER_USER }}@${{ secrets.XSERVER_HOST }} \
              "cd $DEPLOY_DIRECTORY && \
              /usr/bin/php8.5 artisan up && \
              rm -f storage/framework/down storage/framework/maintenance.php && \
              test ! -e storage/framework/down && \
              test ! -e storage/framework/maintenance.php"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "maintenance up ssh attempt ${attempt} failed; retrying in $((attempt * 30))s..." >&2
              sleep "$((attempt * 30))"
            fi
          done
          echo "failed to disable maintenance mode after 3 attempts" >&2
          exit 1

      # artisan up の成功は CLI ブートの証明でしかない。デプロイ成功とみなす条件は2つ:
      #   1. 到達性 — web 経路（リライト・PHP-FPM）が health エンドポイントで 200 を返す
      #   2. アセット存在 — 今回の manifest が参照するビルド済みアセットが配信される
      #      （/up は @vite を読まないため、アセット欠落は /up の 200 だけでは検出できない）
      # どちらのプローブも「今回のリリースが応答した」ことまでは示さない。Web SAPI の OPcache が
      # 旧バイトコードを返している間も両方 200 になり得る。その窓は maintenance 解除より前の
      # Wait for OPcache revalidation で閉じてあるので、ここは待たずに即座に測る。
      # 判定・リトライの詳細は scripts/verify-release-health.mjs と TADR-0006。
      # このスクリプトは依存を持たない: deploy ジョブは pnpm install も setup-node もしない。
      # 失敗・キャンセル時の maintenance への引き戻しは次の Withdraw unhealthy release が担う。
      - name: Verify release health
        id: verify-release-health
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
          # Basic 認証で保護された環境（develop など）だけが設定する任意の secret。
          # 資格情報は URL へ埋め込めないため（Validate が userinfo 付き URL を拒否する）、
          # 別の secret として渡し、2プローブすべてに付与する。未設定なら無認証のまま。
          HEALTHCHECK_BASIC_AUTH: ${{ secrets.HEALTHCHECK_BASIC_AUTH }}
        run: node scripts/verify-release-health.mjs

      # 検証が success で終わらなかったリリース（失敗だけでなく手動キャンセルも含む）を
      # 公開したままにしない（TADR-0006 の fail-closed。復旧手順は docs/infrastructure.md）。
      # 条件は解除ステップの outcome ではなく lift-attempt マーカー: リモート完了直後の
      # SSH 切断・キャンセルで解除ステップが failure / cancelled になっても、サイトが
      # 公開済みの可能性がある限り installer を再実行して計画503の裏へ引き戻す（再実行は
      # 冪等で、maintenance が有効なままなら 503 を維持するだけ）。マーカー以前の失敗では
      # 実行せず、無傷な旧リリースや有効な maintenance をそのまま保つ。
      - name: Withdraw unhealthy release
        if: ${{ always() && steps.maintenance-lift-attempt.outcome == 'success' && steps.verify-release-health.outcome != 'success' }}
        env:
          DEPLOY_DIRECTORY: ${{ secrets.DEPLOY_DIRECTORY }}
        run: |
          for attempt in 1 2 3; do
            if ssh -p 10022 -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
              ${{ secrets.XSERVER_USER }}@${{ secrets.XSERVER_HOST }} \
              "cd -- \"$DEPLOY_DIRECTORY\" && /usr/bin/php8.5" < .github/deploy/enable-maintenance.php; then
              echo "unhealthy release withdrawn behind maintenance mode; fix and rerun the workflow" >&2
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "maintenance re-down ssh attempt ${attempt} failed; retrying in $((attempt * 30))s..." >&2
              sleep "$((attempt * 30))"
            fi
          done
          echo "failed to re-enter maintenance mode; the unhealthy release is still live" >&2
          exit 1
