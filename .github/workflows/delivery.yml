name: delivery

on:
  push:
    branches:
      - develop
      - main
  # GITHUB_TOKEN による push ではワークフローが起動しないため、security-fix が反映後に起動する。
  workflow_dispatch:

concurrency:
  group: delivery-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  provenance:
    if: >-
      ${{ !github.event.repository.is_template &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      id-token: write
      pull-requests: read
    outputs:
      tree: ${{ steps.lookup.outputs.tree }}
      artifact: ${{ steps.lookup.outputs.artifact }}
      verified-run: ${{ steps.lookup.outputs.verified-run }}

    steps:
      # 認証できなくても CircleCI の E2E を確認できないだけなので、未検証として扱う。
      - name: Authenticate to Google Cloud
        if: vars.E2E_RECORD_BUCKET != ''
        continue-on-error: true
        uses: google-github-actions/auth@v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}

      - name: Find a verified build of this tree
        id: lookup
        env:
          GH_TOKEN: ${{ github.token }}
          E2E_RECORD_BUCKET: ${{ vars.E2E_RECORD_BUCKET }}
        run: |
          tree=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$GITHUB_SHA" --jq .tree.sha)
          echo "tree=$tree" >> "$GITHUB_OUTPUT"

          merged=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            --jq ".[] | select(.merge_commit_sha == \"$GITHUB_SHA\") | \"\(.number) \(.head.sha)\"") || merged=
          merged_head=
          if [ -n "$merged" ]; then
            read -r number head <<< "$merged"
            # base を差し替えた PR の run は、別ブランチのワークフローで動いた可能性がある。
            if base_changes=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$number/events" \
              --jq '.[] | select(.event == "base_ref_changed") | .id') && [ -z "$base_changes" ]; then
              merged_head=$head
            fi
          fi

          find_run() {
            runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$1&per_page=100" \
              --jq '.artifacts[] | select(.expired | not) | .workflow_run.id') || return 0

            for run in $runs; do
              meta=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq '
                select(
                  .status == "completed" and .conclusion == "success" and
                  .head_repository.id == .repository.id and
                  (.path == ".github/workflows/quality.yml" or .path == ".github/workflows/delivery.yml" or
                  .path == ".github/workflows/security-fix.yml")
                ) | "\(.event) \(.head_sha) \(.html_url)"') || meta=
              [ -n "$meta" ] || continue
              read -r event head_sha url <<< "$meta"

              # 成果物名は実行したワークフローが自由に決められるため、run の実行元でも照合する。
              if [ "$event" = pull_request ]; then
                [ -n "$merged_head" ] && [ "$head_sha" = "$merged_head" ] || continue
              else
                run_tree=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$head_sha" --jq .tree.sha) || continue
                [ "$run_tree" = "$tree" ] || continue
              fi

              echo "$run $url"
              return 0
            done
          }

          artifact=build-$tree
          found=$(find_run "$artifact")

          if [ -z "$found" ] && [ -n "$E2E_RECORD_BUCKET" ]; then
            found=$(find_run "build-$tree-needs-e2e")
            if [ -n "$found" ] &&
              proof=$(gcloud storage cat "gs://$E2E_RECORD_BUCKET/$GITHUB_REPOSITORY/e2e/$tree.json") &&
              [ "$(jq -r .tree <<< "$proof")" = "$tree" ] &&
              [ "$(jq -r .repository <<< "$proof")" = "$GITHUB_REPOSITORY" ]; then
              artifact=build-$tree-needs-e2e
              e2e=" and E2E in $(jq -r .build <<< "$proof")"
            else
              found=
            fi
          fi
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"

          if [ -z "$found" ]; then
            echo "No verified build of tree $tree; running lint and tests." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          read -r run url <<< "$found"
          echo "verified-run=$run" >> "$GITHUB_OUTPUT"
          echo "Tree $tree passed lint and tests in $url${e2e:-}; deploying its build." >> "$GITHUB_STEP_SUMMARY"

  quality:
    needs: provenance
    if: needs.provenance.outputs.verified-run == ''
    uses: ./.github/workflows/reusable-quality.yml

  # 直前のコミットと比べると、検証を省いたリリースや、拒まれた配備の次の push で脆弱性が増える。
  audit:
    needs: provenance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup mise
        uses: jdx/mise-action@v5.2.1

      - name: Setup PHP
        uses: shivammathur/setup-php@2.40.0
        with:
          php-version: 8.5
          tools: composer:2.10.3
          coverage: none

      - name: Audit against the deployed release
        id: audit
        env:
          GH_TOKEN: ${{ github.token }}
          ENVIRONMENT: ${{ github.ref_name == 'main' && 'Production' || 'Develop' }}
        run: |
          deployments=$(gh api --paginate "repos/$GITHUB_REPOSITORY/deployments?environment=$ENVIRONMENT&per_page=100" \
            --jq '.[] | "\(.id) \(.sha)"')
          deployed=
          while read -r id sha; do
            [ -n "$id" ] || break
            succeeded=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses?per_page=100" \
              --jq 'any(.[]; .state == "success")')
            if [ "$succeeded" = true ]; then
              deployed=$sha
              break
            fi
          done <<< "$deployments"

          if [ -n "$deployed" ]; then
            git fetch --no-tags --depth=1 origin "$deployed"
            scripts/ci/security-audit.sh ratchet FETCH_HEAD
          else
            composer audit --locked --abandoned=report
            pnpm audit
          fi

  deploy:
    runs-on: ubuntu-latest
    # 打ち切られた配備はメンテナンスモードのまま残るため、再試行を含めても届かない長さにする。
    timeout-minutes: 45
    needs: [provenance, quality, audit]
    if: >-
      !cancelled() && needs.provenance.result == 'success' && needs.audit.result == 'success' &&
      (needs.quality.result == 'success' ||
      (needs.provenance.outputs.verified-run != '' && needs.quality.result == 'skipped'))
    permissions:
      actions: read
      contents: read
    environment: ${{ github.ref_name == 'main' && 'Production' || 'Develop' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Validate deployment configuration
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
          CLOUDFLARE_PROXY_SECRET: ${{ secrets.CLOUDFLARE_PROXY_SECRET }}
          CLOUDFLARE_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
          CLOUDFLARE_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
        run: |
          node -e '
            const raw = process.env.HEALTHCHECK_URL ?? ""
            try {
              if (raw === "https://" + new URL(raw).hostname + "/up") process.exit(0)
            } catch {}
            process.exit(1)
          ' || {
            echo "HEALTHCHECK_URL must be exactly https://<host>/up, with the host in canonical form." >&2
            exit 1
          }

          if [[ ! "${CLOUDFLARE_PROXY_SECRET:-}" =~ ^[A-Za-z0-9_-]{32,}$ ]]; then
            echo "CLOUDFLARE_PROXY_SECRET must be at least 32 letters, digits, '-' or '_'." >&2
            exit 1
          fi

          # Develop は Access だけで守るため、トークンなしに配備しない。
          if [ "$GITHUB_REF_NAME" = develop ] ||
            [ -n "${CLOUDFLARE_ACCESS_CLIENT_ID:-}${CLOUDFLARE_ACCESS_CLIENT_SECRET:-}" ]; then
            if [ -z "${CLOUDFLARE_ACCESS_CLIENT_ID:-}" ] || [ -z "${CLOUDFLARE_ACCESS_CLIENT_SECRET:-}" ]; then
              echo "CLOUDFLARE_ACCESS_CLIENT_ID and CLOUDFLARE_ACCESS_CLIENT_SECRET must both be set." >&2
              exit 1
            fi
          fi

      # トークンがなければ run-id は無視され、この run から取得する。
      - name: Download build artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          name: ${{ needs.provenance.outputs.artifact }}
          path: public/build/
          github-token: ${{ needs.provenance.outputs.verified-run && github.token || '' }}
          run-id: ${{ needs.provenance.outputs.verified-run || github.run_id }}

      # 再利用したビルドも E2E まで検証済みの名前で残し、同じツリーのリリースで再検証しない。
      - name: Keep the reused build for releases
        if: needs.provenance.outputs.verified-run != ''
        uses: actions/upload-artifact@v7.0.2
        with:
          name: build-${{ needs.provenance.outputs.tree }}
          path: public/build/
          retention-days: 3

      - name: Check release-critical files
        run: |
          test -f public/build/manifest.json
          test -f public/opengraph-image.jpg
          node --input-type=module -e '
            import { existsSync, readFileSync } from "node:fs"
            const root = "public/build/"
            const entries = Object.values(JSON.parse(readFileSync(root + "manifest.json", "utf8")))
            if (entries.length === 0) throw new Error("Vite manifest is empty")
            const files = entries.flatMap((entry) => [
              entry.file,
              ...(entry.css ?? []),
              ...(entry.assets ?? []),
            ]).filter((file) => typeof file === "string")
            const missing = files.filter((file) => !existsSync(root + file))
            if (missing.length > 0) throw new Error("Vite assets missing: " + missing.join(", "))
          '

      - name: Create deployment package
        env:
          CLOUDFLARE_PROXY_SECRET: ${{ secrets.CLOUDFLARE_PROXY_SECRET }}
        run: |
          mkdir -p .deploy
          rsync -av --exclude-from='.deployignore' ./ .deploy/

          if [ "$GITHUB_REF_NAME" = "develop" ]; then
            test -f .htaccess.develop
            cp .htaccess.develop .deploy/.htaccess
            printf 'User-agent: *\nDisallow: /\n' > .deploy/public/robots.txt
            rm -f .deploy/public/sitemap.xml
          fi

          # Require のない .htaccess は、配備前の確認では稼働中のリリースの認可を継いで通るため、照合の有無はここで確かめる。
          digest=$(printf '%s' "$CLOUDFLARE_PROXY_SECRET" | sha1sum | cut -d ' ' -f 1)
          for file in .deploy/.htaccess .deploy/public/index.php; do
            if ! grep -Fq '{CLOUDFLARE_PROXY_SECRET_SHA1}' "$file"; then
              echo "$file is missing {CLOUDFLARE_PROXY_SECRET_SHA1}." >&2
              exit 1
            fi
            sed -i "s/{CLOUDFLARE_PROXY_SECRET_SHA1}/$digest/g" "$file"
          done

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.XSERVER_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          test -n "${{ secrets.XSERVER_KNOWN_HOSTS }}"
          printf '%s\n' "${{ secrets.XSERVER_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts

      - name: Verify XServer toolchain
        run: |
          for attempt in 1 2 3; do
            if ssh -p 10022 -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
              ${{ secrets.XSERVER_USER }}@${{ secrets.XSERVER_HOST }} \
              "test -x /usr/bin/php8.5 && \
              test -r ~/opt/bin/composer-2.10.3 && \
              composer_version=\$(/usr/bin/php8.5 ~/opt/bin/composer-2.10.3 --version --no-ansi) && \
              printf '%s\n' \"\$composer_version\" && \
              printf '%s\n' \"\$composer_version\" | grep -Eq '^Composer version 2\.10\.3([[:space:]]|$)'"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep "$((attempt * 30))"
            fi
          done
          exit 1

      # 一時ディレクトリにリリースと同じ配置で置いた .htaccess は、親の rewrite と認可を置き換える。そのため、今の
      # リリースと関係なく、配備するホストの規則と照合を確かめられる。ファイルは public/ にだけ置き、リリースが
      # アプリのホストとして public/ へ書き換える場合にだけ届くようにする。
      - name: Verify Cloudflare before the release
        env:
          DEPLOY_DIRECTORY: ${{ secrets.DEPLOY_DIRECTORY }}
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
          XSERVER_HOST: ${{ secrets.XSERVER_HOST }}
          CLOUDFLARE_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
          CLOUDFLARE_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
        run: |
          host=${HEALTHCHECK_URL#https://}
          host=${host%/up}
          token=$(openssl rand -hex 16)
          dir=delivery-$token
          origin=(--connect-to "$host:443:$XSERVER_HOST:443")
          login='^https://[a-z0-9-]+\.cloudflareaccess\.com/'

          access=()
          if [ -n "${CLOUDFLARE_ACCESS_CLIENT_ID:-}" ]; then
            access=(--header "CF-Access-Client-Id: $CLOUDFLARE_ACCESS_CLIENT_ID"
              --header "CF-Access-Client-Secret: $CLOUDFLARE_ACCESS_CLIENT_SECRET")
          fi

          remote() {
            for attempt in 1 2 3; do
              if ssh -p 10022 -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
                ${{ secrets.XSERVER_USER }}@${{ secrets.XSERVER_HOST }} "$1" < "${2:-/dev/null}"; then
                return 0
              fi
              if [ "$attempt" -lt 3 ]; then
                sleep "$((attempt * 30))"
              fi
            done
            return 1
          }

          fetch() {
            curl --silent --show-error --connect-timeout 5 --max-time 10 --write-out ' %{http_code}' "$@" || :
          }

          redirect() {
            curl --silent --show-error --connect-timeout 5 --max-time 10 \
              --output /dev/null --write-out '%{redirect_url}' "$1" || :
          }

          mkdir -p "$RUNNER_TEMP/$dir/public"
          # 先頭の規則は、秘密が平文の HTTP でオリジンに届いたときに 410 を返し、リリースの HTTPS への転送と見分ける。
          {
            printf '<IfModule mod_rewrite.c>\n  RewriteEngine On\n  RewriteCond %%{HTTPS} off\n  RewriteRule ^gated\\.jpg$ - [G]\n</IfModule>\n'
            cat .deploy/.htaccess
            printf '<Files "open.jpg">\n  Require all granted\n</Files>\n'
          } > "$RUNNER_TEMP/$dir/.htaccess"
          cp .deploy/public/.htaccess "$RUNNER_TEMP/$dir/public/.htaccess"
          # .jpg は XServer のキャッシュの対象になる。
          printf '%s' "$token" > "$RUNNER_TEMP/$dir/public/gated.jpg"
          printf '%s' "$token" > "$RUNNER_TEMP/$dir/public/open.jpg"
          tar -C "$RUNNER_TEMP" -cf "$RUNNER_TEMP/probe.tar" "$dir"

          trap 'remote "rm -rf -- \"$DEPLOY_DIRECTORY/$dir\"" || :' EXIT
          remote "mkdir -p -- \"$DEPLOY_DIRECTORY\" && tar -xf - -C \"$DEPLOY_DIRECTORY\"" "$RUNNER_TEMP/probe.tar"

          # トークンは、ホストがこの配備先のものであり、Access が匿名の要求を止めていると確かめてから送る。
          response=$(fetch "${origin[@]}" "https://$host/$dir/open.jpg")
          if [ "$response" != "$token 200" ]; then
            echo "XSERVER_HOST does not serve $host's app from DEPLOY_DIRECTORY under the release's .htaccess" \
              "(status ${response##* }); check that HEALTHCHECK_URL names this environment's canonical host" \
              "and that XServer's certificate for it is valid, as Full (strict) requires." >&2
            exit 1
          fi

          if [ ${#access[@]} -gt 0 ]; then
            for path in /up / "/$dir/gated.jpg"; do
              if [[ ! "$(redirect "https://$host$path")" =~ $login ]]; then
                echo "https://$host$path answered an anonymous request without redirecting to Cloudflare Access." >&2
                exit 1
              fi
            done
          fi

          response=$(fetch "${access[@]}" "https://$host/$dir/gated.jpg")
          if [ "${response##* }" = 410 ]; then
            echo "Cloudflare sent the secret to the origin over plain HTTP; set the SSL/TLS mode to Full (strict)" \
              "and rotate the secret." >&2
            exit 1
          fi
          if [ "$response" != "$token 200" ]; then
            echo "Cloudflare did not serve the check file at https://$host/$dir/gated.jpg (status ${response##* });" \
              "check that its DNS record is proxied to XSERVER_HOST, the Transform Rule value, the Access service token," \
              "and that the origin's Apache accepts the check." >&2
            exit 1
          fi

          # Cloudflare 自身が /up に答える設定（Access のポリシー、チャレンジ、キャッシュ、Worker）は、配備後の
          # ヘルスチェックを失敗させるので、リリースを置き換える前に止める。オリジンの応答には、エラーでも
          # DYNAMIC か BYPASS の cf-cache-status が付く。修復の配備は止めないよう、応答がない場合と 5xx は通す。
          response=$(curl --silent --show-error --connect-timeout 5 --max-time 10 --output /dev/null --dump-header - \
            --write-out '%{http_code}' "${access[@]}" "https://$host/up") || response=
          status=${response: -3}
          cache=$(grep -Eio '^cf-cache-status: *[a-z]+' <<< "$response") || cache=
          if [[ "$status" =~ ^[1-4] ]] && ! grep -Eiq ': *(DYNAMIC|BYPASS)$' <<< "$cache"; then
            echo "Cloudflare may answer https://$host/up itself (status $status, ${cache:-no cf-cache-status});" \
              "keep Access policies that refuse delivery's token, challenges, Cache Rules, and Workers away from it." >&2
            exit 1
          fi

          response=$(fetch "${origin[@]}" "https://$host/$dir/gated.jpg")
          if [ "${response##* }" != 403 ]; then
            echo "The origin answered ${response##* } to a direct request without the secret instead of 403;" \
              "a 200 means Xアクセラレータ is on or the release's .htaccess admits requests without it." >&2
            exit 1
          fi

          # Always Use HTTPS がないと、秘密のない HTTP の要求はオリジンの転送より先に拒まれる。資格情報は
          # 平文で送らないので、Access が先にログインへ送る場合は、オリジンに届かないことだけを確かめる。
          response=$(fetch --output /dev/null "http://$host/$dir/gated.jpg")
          if [ "${response##* }" = 410 ]; then
            echo "Cloudflare sent the secret to the origin over plain HTTP; turn on Always Use HTTPS," \
              "keep ssl in the Transform Rule, and rotate the secret." >&2
            exit 1
          fi
          location=$(redirect "http://$host/$dir/gated.jpg")
          if [ "$location" != "https://$host/$dir/gated.jpg" ] && [[ ! "$location" =~ $login ]]; then
            echo "Cloudflare does not redirect http://$host to HTTPS; turn on Always Use HTTPS." >&2
            exit 1
          fi

      - name: Enable maintenance mode
        env:
          DEPLOY_DIRECTORY: ${{ secrets.DEPLOY_DIRECTORY }}
        run: |
          for attempt in 1 2 3; do
            if ssh -p 10022 -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
              ${{ secrets.XSERVER_USER }}@${{ secrets.XSERVER_HOST }} \
              "mkdir -p -- \"$DEPLOY_DIRECTORY\" && \
              if [ -f \"$DEPLOY_DIRECTORY/artisan\" ] && [ -r \"$DEPLOY_DIRECTORY/vendor/autoload.php\" ]; then \
                cd -- \"$DEPLOY_DIRECTORY\" && \
                { /usr/bin/php8.5 artisan down --render='errors::503' --retry=60 || :; } && \
                [ -s storage/framework/down ] && \
                [ -r storage/framework/maintenance.php ] && \
                [ -r vendor/laravel/framework/src/Illuminate/Foundation/Console/stubs/maintenance-mode.stub ] && \
                cmp -s storage/framework/maintenance.php vendor/laravel/framework/src/Illuminate/Foundation/Console/stubs/maintenance-mode.stub && \
                /usr/bin/php8.5 -r '\$data = json_decode(file_get_contents(\$argv[1]), true); exit(is_array(\$data) && (\$data[\"except\"] ?? null) === [\"/up\"] && is_string(\$data[\"template\"] ?? null) && \$data[\"template\"] !== \"\" && (\$data[\"status\"] ?? null) === 503 && (\$data[\"retry\"] ?? null) === 60 && (\$data[\"redirect\"] ?? null) === null && (\$data[\"refresh\"] ?? null) === null && (\$data[\"secret\"] ?? null) === null ? 0 : 1);' storage/framework/down; \
              fi"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep "$((attempt * 30))"
            fi
          done
          exit 1

      - name: Deploy to XServer via Rsync
        env:
          DEPLOY_DIRECTORY: ${{ secrets.DEPLOY_DIRECTORY }}
        run: |
          ssh_opts="ssh -p 10022 -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=4"
          for attempt in 1 2 3; do
            if rsync -avz --delete --timeout=60 \
              -e "$ssh_opts" \
              --exclude='.env' \
              --exclude='.user.ini' \
              --exclude='/public/storage' \
              --exclude='/vendor' \
              --exclude='storage/app/private/**' \
              --exclude='storage/app/public/**' \
              --exclude='storage/logs/*' \
              --exclude='storage/framework/cache/data/*' \
              --exclude='/storage/framework/down' \
              --exclude='/storage/framework/maintenance.php' \
              --exclude='storage/framework/sessions/*' \
              --exclude='storage/framework/views/*' \
              --exclude='dev.example.com' \
              .deploy/ "${{ secrets.XSERVER_USER }}@${{ secrets.XSERVER_HOST }}:$DEPLOY_DIRECTORY/"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep "$((attempt * 30))"
            fi
          done
          exit 1

      - name: Run post-deploy commands
        env:
          DEPLOY_DIRECTORY: ${{ secrets.DEPLOY_DIRECTORY }}
        run: |
          # 途中で失敗した migration の再実行で部分変更や後続エラーを増やさないよう、サーバ上の失敗は再試行しない。
          # PHP は致命的エラーでも 255 を返すため、サーバ上の失敗は || exit 1 で 1 にそろえる。
          # 再試行するのは SSH が終了コード 255 を返した場合だけ。実行途中の通信切断も含むため、
          # コマンドが再実行される可能性は残る。
          for attempt in 1 2 3; do
            status=0
            ssh -p 10022 -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
              ${{ secrets.XSERVER_USER }}@${{ secrets.XSERVER_HOST }} \
              "cd -- \"$DEPLOY_DIRECTORY\" && \
              /usr/bin/php8.5 ~/opt/bin/composer-2.10.3 install --no-dev --no-interaction --optimize-autoloader && \
              /usr/bin/php8.5 artisan down --render='errors::503' --retry=60 && \
              [ -s storage/framework/down ] && \
              [ -r storage/framework/maintenance.php ] && \
              [ -r vendor/laravel/framework/src/Illuminate/Foundation/Console/stubs/maintenance-mode.stub ] && \
              cmp -s storage/framework/maintenance.php vendor/laravel/framework/src/Illuminate/Foundation/Console/stubs/maintenance-mode.stub && \
              /usr/bin/php8.5 -r '\$data = json_decode(file_get_contents(\$argv[1]), true); exit(is_array(\$data) && (\$data[\"except\"] ?? null) === [\"/up\"] && is_string(\$data[\"template\"] ?? null) && \$data[\"template\"] !== \"\" && (\$data[\"status\"] ?? null) === 503 && (\$data[\"retry\"] ?? null) === 60 && (\$data[\"redirect\"] ?? null) === null && (\$data[\"refresh\"] ?? null) === null && (\$data[\"secret\"] ?? null) === null ? 0 : 1);' storage/framework/down && \
              /usr/bin/php8.5 artisan config:cache && \
              /usr/bin/php8.5 artisan route:cache && \
              /usr/bin/php8.5 artisan view:cache && \
              /usr/bin/php8.5 artisan migrate --force || exit 1" || status=$?
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            if [ "$status" -ne 255 ]; then
              echo "::error title=Post-deploy commands failed::A command failed on the server; this attempt was not retried. Maintenance mode was not automatically disabled. Inspect the error above and repair any partial database changes before redeploying." >&2
              exit 1
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep "$((attempt * 30))"
            fi
          done
          exit 1

      - name: Wait for OPcache revalidation
        run: sleep 2

      - name: Disable maintenance mode
        env:
          DEPLOY_DIRECTORY: ${{ secrets.DEPLOY_DIRECTORY }}
        run: |
          for attempt in 1 2 3; do
            if ssh -p 10022 -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
              ${{ secrets.XSERVER_USER }}@${{ secrets.XSERVER_HOST }} \
              "cd -- \"$DEPLOY_DIRECTORY\" && /usr/bin/php8.5 artisan up"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep "$((attempt * 30))"
            fi
          done
          exit 1

      - name: Verify release health
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
          CLOUDFLARE_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
          CLOUDFLARE_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
        run: |
          access=()
          if [ -n "${CLOUDFLARE_ACCESS_CLIENT_ID:-}" ]; then
            access=(--header "CF-Access-Client-Id: $CLOUDFLARE_ACCESS_CLIENT_ID"
              --header "CF-Access-Client-Secret: $CLOUDFLARE_ACCESS_CLIENT_SECRET")
          fi

          for attempt in 1 2 3; do
            response=$(
              curl --silent --show-error --output /dev/null --dump-header - --write-out '%{http_code}' \
                --connect-timeout 5 --max-time 5 \
                "${access[@]}" "$HEALTHCHECK_URL"
            ) || response=
            status=${response: -3}
            cache=$(grep -Eio '^cf-cache-status: *[a-z]+' <<< "$response") || cache=

            # キャッシュの対象にした 200 や、Worker などがオリジンを通さずに返した 200 は、リリースの稼働を示さない。
            if [ "$status" = 200 ] && grep -Eiq ': *(DYNAMIC|BYPASS)$' <<< "$cache"; then
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              sleep 1
            fi
          done

          echo "Release health check failed: $HEALTHCHECK_URL returned ${status:-no response} (${cache:-no cf-cache-status})." >&2
          exit 1

  notify-failure:
    # bot の push で動いた実行は、失敗しても誰にも通知されない。
    needs: [provenance, quality, audit, deploy]
    if: failure() && endsWith(github.actor, '[bot]')
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Open an issue for the failed delivery
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" --assignee "$GITHUB_REPOSITORY_OWNER" \
            --title "delivery failed on $GITHUB_REF_NAME" --body "$RUN_URL"
