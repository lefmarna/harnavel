name: delivery

on:
  push:
    branches:
      - develop
      - main

concurrency:
  group: delivery-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/ci-lint

  test:
    needs: lint
    uses: ./.github/workflows/reusable-test.yml
    with:
      upload-artifacts: true

  deploy:
    runs-on: ubuntu-latest
    needs: test
    # Each environment must define its own XSERVER_* and DEPLOY_DIRECTORY secrets.
    environment: ${{ github.ref_name == 'main' && 'Production' || 'Develop' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # テストジョブでビルドした成果物をダウンロード
      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          name: build
          path: public/build/

      # 対象ファイルのリストはアプリ較正（.shared-surface.yml: delivery.yml は Tier 2）
      - name: Check release-critical files
        run: |
          missing=0
          for f in public/build/manifest.json public/opengraph-image.jpg; do
            if [ ! -f "$f" ]; then
              echo "::error::Release-critical file missing: $f"
              missing=1
            fi
          done
          [ $missing -eq 0 ] || exit 1

      - name: Create deployment package
        run: |
          mkdir -p .deploy
          rsync -av --exclude-from='.deployignore' ./ .deploy/

          # develop環境では .htaccess.develop を使用
          if [ "${{ github.ref_name }}" = "develop" ]; then
            test -f .htaccess.develop || { echo '.htaccess.develop is missing' >&2; exit 1; }
            cp .htaccess.develop .deploy/.htaccess

            # develop環境は検索エンジンに公開しない
            printf 'User-agent: *\nDisallow: /\n' > .deploy/public/robots.txt
            rm -f .deploy/public/sitemap.xml
          fi

      # SSH設定（XSERVER_KNOWN_HOSTSを必須にしてknown_hostsへ登録）
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.XSERVER_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          if [ -z "${{ secrets.XSERVER_KNOWN_HOSTS }}" ]; then
            echo "XSERVER_KNOWN_HOSTS is required" >&2
            exit 1
          fi
          printf '%s\n' "${{ secrets.XSERVER_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts

      # rsync除外の方針:
      # - .deployignore: ローカルパッケージ作成時の除外（開発用ファイル等）
      # - rsync --exclude: サーバー側の既存データ保護（.env, storage, サブドメイン等）
      # XServerへのSSH接続は稀に瞬断・スロットリングで失敗するため、
      # 接続タイムアウトを短めにして指数バックオフでリトライする。
      - name: Deploy to XServer via Rsync
        env:
          DEPLOY_DIRECTORY: ${{ secrets.DEPLOY_DIRECTORY }}
        run: |
          ssh_opts="ssh -p 10022 -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=4"
          for attempt in 1 2 3; do
            if rsync -avz --delete --timeout=60 \
              -e "$ssh_opts" \
              --exclude='.env' \
              --exclude='.user.ini' \
              --exclude='storage/app/private/**' \
              --exclude='storage/app/public/**' \
              --exclude='storage/logs/*' \
              --exclude='storage/framework/cache/data/*' \
              --exclude='storage/framework/sessions/*' \
              --exclude='storage/framework/views/*' \
              --exclude='dev.laravel-app-template.com' \
              .deploy/ "${{ secrets.XSERVER_USER }}@${{ secrets.XSERVER_HOST }}:$DEPLOY_DIRECTORY/"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "rsync attempt ${attempt} failed; retrying in $((attempt * 30))s..." >&2
              sleep "$((attempt * 30))"
            fi
          done
          echo "rsync failed after 3 attempts" >&2
          exit 1

      - name: Run Post-Deploy Commands
        env:
          DEPLOY_DIRECTORY: ${{ secrets.DEPLOY_DIRECTORY }}
        run: |
          for attempt in 1 2 3; do
            if ssh -p 10022 -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
              ${{ secrets.XSERVER_USER }}@${{ secrets.XSERVER_HOST }} \
              "cd $DEPLOY_DIRECTORY && \
              /usr/bin/php8.5 ~/opt/bin/composer-2.9.7 install --no-dev --no-interaction --optimize-autoloader && \
              /usr/bin/php8.5 artisan config:cache && \
              /usr/bin/php8.5 artisan route:cache && \
              /usr/bin/php8.5 artisan view:cache && \
              /usr/bin/php8.5 artisan migrate --force"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "post-deploy ssh attempt ${attempt} failed; retrying in $((attempt * 30))s..." >&2
              sleep "$((attempt * 30))"
            fi
          done
          echo "post-deploy ssh failed after 3 attempts" >&2
          exit 1
