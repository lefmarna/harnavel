name: delivery

on:
  push:
    branches:
      - develop
      - main

concurrency:
  group: delivery-${{ github.ref }}
  # maintenance mode 中の実行を新しい push で中断しない。
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/ci-lint

  test:
    needs: lint
    uses: ./.github/workflows/reusable-test.yml
    with:
      upload-artifacts: true

  deploy:
    runs-on: ubuntu-latest
    needs: test
    # Each environment must define its own XSERVER_*, DEPLOY_DIRECTORY, and HEALTHCHECK_URL secrets.
    environment: ${{ github.ref_name == 'main' && 'Production' || 'Develop' }}

    env:
      # デプロイ試行固有ID。commit SHA だけでは同じコミットの再実行と区別できず、旧試行の
      # 応答を成功として受け入れてしまうため、run id と試行番号を含める。
      RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      # リリース同一性ゲートの適用段階（TADR-0006）:
      # observe = 到達性とアセット存在だけを成功条件にし、リリースIDと Web SAPI の OPcache
      #           実測値は記録だけする。新エンドポイントが旧バイトコードの裏に隠れていても
      #           健全なリリースを引き戻さない。導入前の設定を測るための段階。
      # enforce = リリース同一性と OPcache 前提を成功条件に含め、満たせなければ fail closed
      #
      # 正典は各 GitHub Environment の設定変数で、ファイルには焼き込まない。Web SAPI の
      # OPcache 設定は環境ごとに実際に叩くまで分からず、CLI や他環境からは推測できないため、
      # 未計測の環境が既定で enforce になると測る前に健全なリリースを計画503へ引き戻す。
      # ファイルの値は新規派生アプリの初期値も兼ねてしまうので、安全側の既定（observe）を
      # 配布物ではなく環境設定側に置く。
      #
      # vars は organization → repository → environment をマージした結果で、式からは
      # どのスコープ由来か判別できない。「environment スコープだけを読む」ことはできないため、
      # 値自身にリポジトリと Environment を名乗らせて照合する
      # （enforce:<owner>/<repo>@<repository_id>:<environment>）。
      # - 環境名だけでは、organization スコープの enforce:Production が同名環境を持つ
      #   全派生アプリの初回本番デプロイに波及する。
      # - slug だけでは、リポジトリ改名後に同じ slug を再利用した別アプリへ届き得る。
      #   数値 ID は再利用されないので、両方を含めて初めて別リポジトリへの波及を機械的に塞げる。
      # - slug も残すのは、切替操作と障害調査で人間が対象を確認できるようにするため。
      # github.repository / github.repository_id は式で常に解決でき、API 呼び出しも追加権限も
      # 要らないため、fail-closed なこの経路に新しい失敗要因（レート制限・権限不足・障害）を
      # 持ち込まない。未設定・空・observe・他リポジトリや他環境を名乗る値はすべて observe。
      DEPLOY_ENVIRONMENT: ${{ github.ref_name == 'main' && 'Production' || 'Develop' }}
      RELEASE_IDENTITY_ENFORCEMENT_SETTING: ${{ vars.RELEASE_IDENTITY_ENFORCEMENT }}
      RELEASE_IDENTITY_ENFORCEMENT: ${{ vars.RELEASE_IDENTITY_ENFORCEMENT == format('enforce:{0}@{1}:{2}', github.repository, github.repository_id, github.ref_name == 'main' && 'Production' || 'Develop') && 'enforce' || 'observe' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # HEALTHCHECK_URL が health check を通り得ない値のままだと、サーバー更新と maintenance
      # 解除まで進んでから初めて落ち、正常なリリースを 503 へ引き戻すことになる。
      # 「検証を通らない値はリモートへ触れる前に fail する」契約を守るため、grep ではなく
      # WHATWG URL パーサー（runner 標準の Node）で検証する。grep は行単位マッチのため末尾
      # 改行付きの値を通し、範囲外ポートや空白も curl の拒否と一致しない。
      # https スキームのみ許可する: .htaccess / .htaccess.develop は %{HTTPS} off を無条件に
      # 301 するため、http URL は health check が追従しない 301 を受けて必ず失敗し、健全な
      # リリースを withdraw させる。オリジン導出を壊す userinfo / query / fragment も禁止する
      # （https://example.com#probe を通すと、アセット URL がルートページへ化けて検証が骨抜き
      # になる）。href と一致する canonical 形だけを受理する。
      - name: Validate deployment configuration
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          node -e '
            const raw = process.env.HEALTHCHECK_URL ?? ""
            let url
            try {
              url = new URL(raw)
            } catch {
              process.exit(1)
            }
            const ok =
              url.protocol === "https:" &&
              url.username === "" &&
              url.password === "" &&
              url.search === "" &&
              url.hash === "" &&
              !raw.includes("?") &&
              !raw.includes("#") &&
              (url.href === raw || url.href === raw + "/")
            process.exit(ok ? 0 : 1)
          ' || {
            echo "HEALTHCHECK_URL environment secret is required and must be a canonical absolute https URL with a host and no whitespace, userinfo, query, or fragment (e.g. https://example.com/up). Use the canonical host: redirects are not followed, so an http URL or a host that redirects (such as www when www redirects to the apex) fails verification." >&2
            exit 1
          }

          # リリースIDが空・不正なまま進むと、応答側の空 ID と一致して偽陽性になり得る。
          # 期待値が確定しない状態ではリモートに触れない。
          node -e '
            const releaseId = process.env.RELEASE_ID ?? ""
            process.exit(/^[0-9a-f]{40}-[1-9][0-9]*-[1-9][0-9]*$/.test(releaseId) ? 0 : 1)
          ' || {
            echo "RELEASE_ID must be <40 hex commit sha>-<run id>-<run attempt>. It is the deploy-attempt identity that release health verification must observe over HTTP." >&2
            exit 1
          }

          # 生の設定値の形式を検証する。解決後の値は式が observe / enforce のどちらかに
          # 畳んでしまうため、typo は「静かに observe」になり切り替え忘れと区別できない。
          case "${RELEASE_IDENTITY_ENFORCEMENT_SETTING:-}" in
            '' | observe | enforce:?*/?*@?*:?*) ;;
            *)
              echo "RELEASE_IDENTITY_ENFORCEMENT must be unset, 'observe', or 'enforce:<owner>/<repo>@<repository id>:<environment>' (for this deployment: 'enforce:${GITHUB_REPOSITORY:-<owner>/<repo>}@${GITHUB_REPOSITORY_ID:-<repository id>}:${DEPLOY_ENVIRONMENT:-<environment>}'). It names the repository and environment it applies to because GitHub merges organization, repository, and environment variables into one context and the scope cannot be recovered here. The numeric repository id is included because a renamed repository frees its slug for reuse." >&2
              exit 1
              ;;
          esac

          # 解決後の値の多層防御。以降のステップはこの値だけを読む。
          case "$RELEASE_IDENTITY_ENFORCEMENT" in
            observe | enforce) ;;
            *)
              echo "RELEASE_IDENTITY_ENFORCEMENT must resolve to 'observe' or 'enforce'." >&2
              exit 1
              ;;
          esac

          # 形式は正しいが他リポジトリ / 他環境を名乗る値は observe に畳まれる。
          # organization / repository スコープの値を継承した場合がこれに当たるので、
          # 黙って観測に落ちないよう警告する。
          if [ "$RELEASE_IDENTITY_ENFORCEMENT" = 'observe' ] &&
            [ -n "${RELEASE_IDENTITY_ENFORCEMENT_SETTING:-}" ] &&
            [ "${RELEASE_IDENTITY_ENFORCEMENT_SETTING:-}" != 'observe' ]; then
            echo "::warning::RELEASE_IDENTITY_ENFORCEMENT is '${RELEASE_IDENTITY_ENFORCEMENT_SETTING}', which does not name this deployment's repository and environment; observing. To enforce, set 'enforce:${GITHUB_REPOSITORY:-<owner>/<repo>}@${GITHUB_REPOSITORY_ID:-<repository id>}:${DEPLOY_ENVIRONMENT:-<environment>}' on the ${DEPLOY_ENVIRONMENT:-target} environment. If that is already set, delete any variable of the same name at repository or organization scope: environment-level variables do not overwrite values already in the vars context, so a broader-scope variable shadows the environment one and is what this run read." >&2
          fi

          # 適用段階はファイルに無いので、実行ごとにログとサマリへ残す。enforce へ切り替えた
          # つもりで効いていない状態をここで気づけるようにする。
          # GITHUB_STEP_SUMMARY はランナー限定。未設定でも失敗せず、かつ抽出した run block を
          # 単体実行するテストがランナーのサマリへ書き込まないよう、テスト側で空にしている。
          echo "release identity enforcement: ${RELEASE_IDENTITY_ENFORCEMENT}"
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            echo "Release identity enforcement: \`${RELEASE_IDENTITY_ENFORCEMENT}\`" >> "$GITHUB_STEP_SUMMARY"
          fi

      # テストジョブでビルドした成果物をダウンロード
      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          name: build
          path: public/build/

      # 対象ファイルのリストはアプリ較正（TADR-0003: delivery.yml は Tier 2）
      - name: Check release-critical files
        run: |
          missing=0
          for f in public/build/manifest.json public/opengraph-image.jpg; do
            if [ ! -f "$f" ]; then
              echo "::error::Release-critical file missing: $f"
              missing=1
            fi
          done
          [ $missing -eq 0 ] || exit 1

      - name: Create deployment package
        run: |
          mkdir -p .deploy
          rsync -av --exclude-from='.deployignore' ./ .deploy/

          # develop環境では .htaccess.develop を使用
          if [ "${{ github.ref_name }}" = "develop" ]; then
            test -f .htaccess.develop || { echo '.htaccess.develop is missing' >&2; exit 1; }
            cp .htaccess.develop .deploy/.htaccess

            # develop環境は検索エンジンに公開しない
            printf 'User-agent: *\nDisallow: /\n' > .deploy/public/robots.txt
            rm -f .deploy/public/sitemap.xml
          fi

      # リリースIDをフロントコントローラの PHP リテラルとして焼き込む。全 HTTP リクエストが
      # 必ず実行する中央成果物なので、Web 側 OPcache がこのファイルの旧エントリを返している
      # 間は旧リリースのIDしか返せず、検証は偽陽性ではなく fail closed に倒れる。
      # 実行時に読み直せる補助ファイルへ書くと、旧バイトコードが新しいIDを読めてしまい保証が
      # 消えるため、置換先は必ずこのファイルに限る（リポジトリ側は空のまま）。
      - name: Stamp release identity
        run: |
          # Validate 済みでも多層防御で再確認する。不正な値をそのまま焼き込むと、後段の照合が
          # 何と一致したのか説明できなくなる。許可集合を固定すると sed の置換文字列も安全になる。
          node -e '
            const releaseId = process.env.RELEASE_ID ?? ""
            process.exit(/^[0-9a-f]{40}-[1-9][0-9]*-[1-9][0-9]*$/.test(releaseId) ? 0 : 1)
          ' || {
            echo "::error::RELEASE_ID must be <40 hex commit sha>-<run id>-<run attempt>" >&2
            exit 1
          }

          # 出現数の判定に grep -Fc は使えない（一致した「行数」を数えるため、同じ行に2つ
          # 並んでいても 1 になり、置換は先頭だけに当たる）。上書きも既存ファイルへの
          # インプレース書き込みにする: 新しい一時ファイルを mv すると 0600 になり、
          # rsync -a がそのモードを本番へ複製して index.php を読めなくし得る。
          PLACEHOLDER="define('LARAVEL_DEPLOYMENT_RELEASE_ID', '');" \
          STAMPED="define('LARAVEL_DEPLOYMENT_RELEASE_ID', '${RELEASE_ID}');" \
          node -e '
            const fs = require("node:fs")
            const file = ".deploy/public/index.php"
            const parts = fs.readFileSync(file, "utf8").split(process.env.PLACEHOLDER)

            if (parts.length !== 2) {
              console.error("::error::expected exactly one release identity placeholder in " + file + ", found " + (parts.length - 1))
              process.exit(1)
            }

            fs.writeFileSync(file, parts.join(process.env.STAMPED))

            if (!fs.readFileSync(file, "utf8").includes(process.env.STAMPED)) {
              console.error("::error::failed to stamp the release identity into " + file)
              process.exit(1)
            }
          '

      # SSH設定（XSERVER_KNOWN_HOSTSを必須にしてknown_hostsへ登録）
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.XSERVER_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          if [ -z "${{ secrets.XSERVER_KNOWN_HOSTS }}" ]; then
            echo "XSERVER_KNOWN_HOSTS is required" >&2
            exit 1
          fi
          printf '%s\n' "${{ secrets.XSERVER_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts

      # PHP/Composer を実際に起動して、破壊的な rsync より前に未配置・破損・版違いを検出する。
      - name: Verify XServer toolchain
        run: |
          for attempt in 1 2 3; do
            if ssh -p 10022 -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
              ${{ secrets.XSERVER_USER }}@${{ secrets.XSERVER_HOST }} \
              "test -x /usr/bin/php8.5 && \
              test -r ~/opt/bin/composer-2.10.2 && \
              composer_version=\$(/usr/bin/php8.5 ~/opt/bin/composer-2.10.2 --version --no-ansi) && \
              printf '%s\n' \"\$composer_version\" && \
              printf '%s\n' \"\$composer_version\" | grep -Eq '^Composer version 2\.10\.2([[:space:]]|$)'"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "toolchain preflight ssh attempt ${attempt} failed; retrying in $((attempt * 30))s..." >&2
              sleep "$((attempt * 30))"
            fi
          done
          echo "XServer toolchain preflight failed after 3 attempts" >&2
          exit 1

      - name: Enable maintenance mode
        env:
          DEPLOY_DIRECTORY: ${{ secrets.DEPLOY_DIRECTORY }}
        run: |
          for attempt in 1 2 3; do
            if ssh -p 10022 -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
              ${{ secrets.XSERVER_USER }}@${{ secrets.XSERVER_HOST }} \
              "mkdir -p -- \"$DEPLOY_DIRECTORY\" && \
              cd -- \"$DEPLOY_DIRECTORY\" && \
              /usr/bin/php8.5" < .github/deploy/enable-maintenance.php; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "maintenance down ssh attempt ${attempt} failed; retrying in $((attempt * 30))s..." >&2
              sleep "$((attempt * 30))"
            fi
          done
          echo "failed to enable maintenance mode after 3 attempts" >&2
          exit 1

      # maintenance mode は入口の新規リクエストだけを止める。破壊的な rsync より前に、
      # 既存の同期リクエストが旧リリースだけで完了するまで待つ。
      # 120秒はテンプレート既定値。最長同期リクエストを上回る値へアプリごとに較正する。
      - name: Drain in-flight requests
        run: sleep 120

      # rsync除外の方針:
      # - .deployignore: ローカルパッケージ作成時の除外（開発用ファイル等）
      # - rsync --exclude: サーバー側の既存データ保護（.env, storage, サブドメイン等）
      # vendor は --delete で消さずに保持する。post-deploy の composer install --no-dev が
      # Composer 管理対象を composer.lock と整合させる。削除すると install 完了までサイトが
      # vendor 無しで停止する。maintenance mode の状態と bootstrap 非依存の503応答も転送中は保持する。
      # XServerへのSSH接続は稀に瞬断・スロットリングで失敗するため、
      # 接続タイムアウトを短めにして指数バックオフでリトライする。
      - name: Deploy to XServer via Rsync
        env:
          DEPLOY_DIRECTORY: ${{ secrets.DEPLOY_DIRECTORY }}
        run: |
          ssh_opts="ssh -p 10022 -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=4"
          for attempt in 1 2 3; do
            if rsync -avz --delete --timeout=60 \
              -e "$ssh_opts" \
              --exclude='.env' \
              --exclude='.user.ini' \
              --exclude='/vendor' \
              --exclude='storage/app/private/**' \
              --exclude='storage/app/public/**' \
              --exclude='storage/logs/*' \
              --exclude='storage/framework/cache/data/*' \
              --exclude='/storage/framework/down' \
              --exclude='/storage/framework/maintenance.php' \
              --exclude='storage/framework/sessions/*' \
              --exclude='storage/framework/views/*' \
              --exclude='dev.laravel-app-template.com' \
              .deploy/ "${{ secrets.XSERVER_USER }}@${{ secrets.XSERVER_HOST }}:$DEPLOY_DIRECTORY/"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "rsync attempt ${attempt} failed; retrying in $((attempt * 30))s..." >&2
              sleep "$((attempt * 30))"
            fi
          done
          echo "rsync failed after 3 attempts" >&2
          exit 1

      - name: Run Post-Deploy Commands
        env:
          DEPLOY_DIRECTORY: ${{ secrets.DEPLOY_DIRECTORY }}
        run: |
          for attempt in 1 2 3; do
            if ssh -p 10022 -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
              ${{ secrets.XSERVER_USER }}@${{ secrets.XSERVER_HOST }} \
              "cd $DEPLOY_DIRECTORY && \
              /usr/bin/php8.5 ~/opt/bin/composer-2.10.2 install --no-dev --no-interaction --optimize-autoloader && \
              /usr/bin/php8.5 artisan config:cache && \
              /usr/bin/php8.5 artisan route:cache && \
              /usr/bin/php8.5 artisan view:cache && \
              /usr/bin/php8.5 artisan migrate --force"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "post-deploy ssh attempt ${attempt} failed; retrying in $((attempt * 30))s..." >&2
              sleep "$((attempt * 30))"
            fi
          done
          echo "post-deploy ssh failed after 3 attempts" >&2
          exit 1

      # 「maintenance 解除をこれから試行する」事実を no-op の成功として記録する。
      # Withdraw unhealthy release は解除ステップ自体の outcome ではなくこのマーカーを
      # 条件にする。リモートで artisan up とファイル削除が完了した直後に SSH 切断や
      # キャンセルが起きると、サイトは公開済みでも解除ステップの outcome は
      # failure / cancelled になり、成功条件では未検証リリースが取り残されるため。
      - name: Mark maintenance lift attempt
        id: maintenance-lift-attempt
        run: echo "maintenance lift will be attempted; an unverified release is withdrawn from here on"

      # 途中失敗時は壊れたリリースを公開せず、再実行または手動復旧まで maintenance mode を保つ。
      # standalone responder は設定された maintenance driver に依存せず書かれるため、
      # artisan up の後にも明示的に削除し、残留していないことを確認する。
      - name: Disable maintenance mode
        env:
          DEPLOY_DIRECTORY: ${{ secrets.DEPLOY_DIRECTORY }}
        run: |
          for attempt in 1 2 3; do
            if ssh -p 10022 -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
              ${{ secrets.XSERVER_USER }}@${{ secrets.XSERVER_HOST }} \
              "cd $DEPLOY_DIRECTORY && \
              /usr/bin/php8.5 artisan up && \
              rm -f storage/framework/down storage/framework/maintenance.php && \
              test ! -e storage/framework/down && \
              test ! -e storage/framework/maintenance.php"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "maintenance up ssh attempt ${attempt} failed; retrying in $((attempt * 30))s..." >&2
              sleep "$((attempt * 30))"
            fi
          done
          echo "failed to disable maintenance mode after 3 attempts" >&2
          exit 1

      # artisan up の成功は CLI ブートの証明でしかない。enforce でデプロイ成功とみなす条件は3つ:
      #   1. 到達性 — web 経路（リライト・PHP-FPM）が health エンドポイントで 200 を返す
      #   2. アセット存在 — 今回の manifest が参照するビルド済みアセットが配信される
      #      （/up は @vite を読まないため、アセット欠落は /up の 200 だけでは検出できない）
      #   3. リリース同一性 — PHP 経由の応答が、今回のデプロイ試行IDを返す
      # 1 と 2 だけでは「何らかのリリースが 200 を返した」ことしか言えない。アセットは静的
      # 配信で PHP を経由せず、フロントエンド無変更なら旧リリースとファイル名まで一致し得る。
      # 3 のIDは stamp 済みフロントコントローラのコンパイル時リテラルなので、Web 側 OPcache が
      # 旧エントリを返す間は旧IDしか返らず、成功終了せずリトライを続ける。
      # リトライ窓は realpath cache / OPcache の再検証遅延（既定 ~120 秒）を上回るように取る。
      # ただし単なる待機延長は validate_timestamps=Off では解決にならないため、Web SAPI 側の
      # 再検証設定そのものを応答から確認する（enforce では保証できなければ fail closed）。
      # observe では 3 を成功条件に含めず記録だけする。新エンドポイントは旧バイトコードの裏に
      # 隠れて現れないことがあり、測る前に健全なリリースを引き戻さないための段階（TADR-0006）。
      # 失敗・キャンセル時の maintenance への引き戻しは次の Withdraw unhealthy release が担う。
      # artisan up の成功は CLI ブートの証明でしかない。enforce でデプロイ成功とみなす条件は3つ:
      #   1. 到達性 — web 経路（リライト・PHP-FPM）が health エンドポイントで 200 を返す
      #   2. アセット存在 — 今回の manifest が参照するビルド済みアセットが配信される
      #   3. リリース同一性 — PHP 経由の応答が、今回のデプロイ試行IDを返す
      # 1 と 2 だけでは「何らかのリリースが 200 を返した」ことしか言えない（アセットは静的
      # 配信で PHP を経由せず、フロントエンド無変更なら旧リリースとファイル名まで一致し得る）。
      # 判定・リトライ・OPcache 前提の詳細は scripts/verify-release-health.mjs と TADR-0006。
      # このスクリプトは依存を持たない: deploy ジョブは pnpm install も setup-node もしない。
      # 失敗・キャンセル時の maintenance への引き戻しは次の Withdraw unhealthy release が担う。
      - name: Verify release health
        id: verify-release-health
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: node scripts/verify-release-health.mjs

      # 検証が success で終わらなかったリリース（失敗だけでなく手動キャンセルも含む）を
      # 公開したままにしない（TADR-0006 の fail-closed。復旧手順は docs/infrastructure.md）。
      # 条件は解除ステップの outcome ではなく lift-attempt マーカー: リモート完了直後の
      # SSH 切断・キャンセルで解除ステップが failure / cancelled になっても、サイトが
      # 公開済みの可能性がある限り installer を再実行して計画503の裏へ引き戻す（再実行は
      # 冪等で、maintenance が有効なままなら 503 を維持するだけ）。マーカー以前の失敗では
      # 実行せず、無傷な旧リリースや有効な maintenance をそのまま保つ。
      - name: Withdraw unhealthy release
        if: ${{ always() && steps.maintenance-lift-attempt.outcome == 'success' && steps.verify-release-health.outcome != 'success' }}
        env:
          DEPLOY_DIRECTORY: ${{ secrets.DEPLOY_DIRECTORY }}
        run: |
          for attempt in 1 2 3; do
            if ssh -p 10022 -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
              ${{ secrets.XSERVER_USER }}@${{ secrets.XSERVER_HOST }} \
              "cd -- \"$DEPLOY_DIRECTORY\" && /usr/bin/php8.5" < .github/deploy/enable-maintenance.php; then
              echo "unhealthy release withdrawn behind maintenance mode; fix and rerun the workflow" >&2
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "maintenance re-down ssh attempt ${attempt} failed; retrying in $((attempt * 30))s..." >&2
              sleep "$((attempt * 30))"
            fi
          done
          echo "failed to re-enter maintenance mode; the unhealthy release is still live" >&2
          exit 1
