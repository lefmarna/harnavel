name: mutation

# 対象クラスは spec 側の mutates() 宣言が単一正典。条件は docs/testing-as-spec.md。

on:
  workflow_dispatch:
  pull_request:
    branches: [develop, main]

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mutation:
    runs-on: ubuntu-latest

    services:
      mariadb-testing:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: password
          MARIADB_DATABASE: app_testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup mise
        uses: jdx/mise-action@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5
          tools: composer:v2
          # ミューテーションテストはテストを多数回実行するため、高速な PCOV を使う。
          coverage: pcov

      - name: Get pnpm store directory
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Cache Composer packages
        uses: actions/cache@v5
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Node Dependencies
        run: pnpm install --frozen-lockfile

      - name: Install PHP Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Build Assets
        run: pnpm run build
        env:
          DB_HOST: 127.0.0.1
          DB_DATABASE: app_testing

      - name: Run mutation testing
        run: |
          # 欠けると変異が適用されないまま偽の Score 100% が出る。
          mkdir -p vendor/pestphp/pest-plugin-mutate/.temp/mutations
          ./vendor/bin/pest --mutate --covered-only --no-progress --min=100
        env:
          DB_HOST: 127.0.0.1
          GOOGLE_CLIENT_ID: test-client-id
          GOOGLE_CLIENT_SECRET: test-client-secret
          GOOGLE_REDIRECT_URI: http://localhost/auth/google/callback
