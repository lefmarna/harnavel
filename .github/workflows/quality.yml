name: quality

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - develop
      - main

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release:
    # リリース PR のマージ結果が develop と同じツリーなら、delivery が検証済みの内容と一致する。
    if: >-
      github.event_name == 'pull_request' && !github.event.pull_request.draft &&
      github.base_ref == 'main' && github.head_ref == 'develop' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      verified: ${{ steps.tree.outputs.verified }}

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2

      - id: tree
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --quiet "$HEAD_SHA" HEAD; then
            echo "verified=true" >> "$GITHUB_OUTPUT"
          fi

  quality:
    needs: release
    # Draft PR は push し放題にする。判定ジョブが失敗したときは検証する側に倒す。
    if: ${{ !cancelled() && !github.event.pull_request.draft && needs.release.outputs.verified != 'true' }}
    uses: ./.github/workflows/reusable-quality.yml
    with:
      # CircleCI が PR の E2E を担うリポジトリでも、手動実行は CircleCI が動かないためここで実行する。
      e2e: ${{ vars.E2E_RECORD_BUCKET == '' || github.event_name != 'pull_request' }}
