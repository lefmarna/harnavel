name: Reusable / Quality

on:
  workflow_call:
    inputs:
      e2e:
        description: Run E2E here; false leaves it to CircleCI (docs/circleci.md)
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      mariadb-testing:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: password
          MARIADB_DATABASE: app_testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: 8.5
          tools: composer:v2
          coverage: pcov

      - name: Get pnpm store directory
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "path=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.path }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Node Dependencies
        run: pnpm install --frozen-lockfile

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Install PHP Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      # 既知の脆弱性を持つ依存を、本番・開発用を問わず取り込んだまま進めない。
      # 作者が開発を終えただけの廃止済みパッケージは、脆弱性ではないので表示だけにとどめる。
      - name: Audit Dependencies
        run: |
          composer audit --locked --abandoned=report
          pnpm audit

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Run Pint
        run: vendor/bin/pint --test

      - name: Cache PHPStan result cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/phpstan
          key: ${{ runner.os }}-phpstan-php-8.5-${{ hashFiles('composer.lock', 'phpstan.neon.dist') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-phpstan-php-8.5-${{ hashFiles('composer.lock', 'phpstan.neon.dist') }}-
            ${{ runner.os }}-phpstan-php-8.5-
            ${{ runner.os }}-phpstan-

      - name: Run Static Analysis
        run: composer analyse

      - name: Check Frontend Formatting
        run: pnpm run format:check

      - name: Generate Wayfinder Files
        run: php artisan wayfinder:generate --with-form

      - name: Lint Frontend
        run: pnpm run lint:check

      - name: Type Check Frontend
        run: pnpm run types:check

      # rhysd/actionlint は action.yml を提供しないため、バージョン固定の公式 Docker イメージを使う。
      - name: Lint GitHub Actions Workflows
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

      - name: Lint Markdown Links
        run: pnpm run lint:docs

      - name: Test Deploy Lifecycle
        run: pnpm run test:deploy-lifecycle

      - name: Test Deploy Rsync Excludes
        run: pnpm run test:deploy-rsync-excludes

      - name: Test Toolchain Version Consistency
        run: pnpm run test:toolchain-versions

      - name: Run Frontend Unit Tests
        run: pnpm run test:unit

      - name: Build Assets
        run: pnpm run build
        env:
          DB_HOST: 127.0.0.1
          DB_DATABASE: app_testing

      - name: Run Tests
        run: ./vendor/bin/pest --coverage --min=90
        env:
          DB_HOST: 127.0.0.1
          GOOGLE_CLIENT_ID: test-client-id
          GOOGLE_CLIENT_SECRET: test-client-secret
          GOOGLE_REDIRECT_URI: http://localhost/auth/google/callback

      - name: Create E2E Database
        if: inputs.e2e
        run: php artisan tinker --execute='DB::statement("CREATE DATABASE IF NOT EXISTS app_e2e");'
        env:
          DB_HOST: 127.0.0.1
          DB_DATABASE: app_testing

      - name: Install Playwright Browsers
        if: inputs.e2e
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E Tests
        if: inputs.e2e
        run: pnpm test:e2e
        env:
          DB_HOST: 127.0.0.1
          DB_DATABASE: app_e2e
          APP_URL: http://localhost:8000
          MAIL_MAILER: array

      - name: Upload E2E failure report
        if: failure() && inputs.e2e
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-failure-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

      # delivery が同じツリーの検証済みビルドとして再利用する。E2E を省いたビルドは名前で区別する。
      - name: Resolve tested tree
        id: tree
        run: echo "sha=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-${{ steps.tree.outputs.sha }}${{ !inputs.e2e && '-needs-e2e' || '' }}
          path: public/build/
          retention-days: 3
