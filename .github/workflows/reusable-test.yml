name: Reusable / Test

on:
  workflow_call:
    inputs:
      upload-artifacts:
        description: 'Upload build artifacts after tests (required for deployment)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mariadb-testing:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: password
          MARIADB_DATABASE: app_testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup mise
        uses: jdx/mise-action@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5
          tools: composer:v2
          coverage: xdebug

      - name: Get pnpm store directory
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Cache Composer packages
        uses: actions/cache@v5
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Node Dependencies
        run: pnpm install --frozen-lockfile

      - name: Install PHP Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Build Assets
        run: pnpm run build
        env:
          DB_HOST: 127.0.0.1
          DB_DATABASE: app_testing

      - name: Run Tests
        run: ./vendor/bin/pest --coverage --min=90
        env:
          DB_HOST: 127.0.0.1
          GOOGLE_CLIENT_ID: test-client-id
          GOOGLE_CLIENT_SECRET: test-client-secret
          GOOGLE_REDIRECT_URI: http://localhost/auth/google/callback

      - name: Run Migrations and Seeding
        run: |
          php artisan migrate --force
          php artisan db:seed --force
        env:
          DB_HOST: 127.0.0.1
          DB_DATABASE: app_testing

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps

      - name: Run E2E Tests
        run: pnpm test:e2e --project=chromium
        env:
          DB_HOST: 127.0.0.1
          DB_DATABASE: app_testing
          APP_URL: http://localhost:8000

      # デプロイ用にビルド成果物を保存（delivery ワークフローからの呼び出し時のみ）
      - name: Upload build artifacts
        if: inputs.upload-artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build
          path: public/build/
          retention-days: 1
