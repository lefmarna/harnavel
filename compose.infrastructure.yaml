# 同じアプリの全 Worktree が使う。通常の down / destroy からは削除しない。
# どの Worktree から操作しても主 Worktree をプロジェクトディレクトリにするため、相対パスは主 Worktree を指す。
services:
  mariadb:
    image: mariadb:10.11
    ports:
      - "127.0.0.1:${MARIADB_PORT}:3306"
    volumes:
      - "./storage/mariadb:/var/lib/mysql"
    environment:
      MARIADB_ROOT_PASSWORD: password
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks:
      - backend

  mailpit:
    image: axllent/mailpit
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT}:8025"
    networks:
      - backend

networks:
  backend:
    name: ${DEV_INFRA_PROJECT}-backend
