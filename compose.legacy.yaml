# DOCKER_BIND_ADDRESS は別端末から見るときだけ 0.0.0.0 にする。単一 bind なので個別 IP を指定すると localhost が届かなくなる。
services:
  nginx:
    image: nginx:stable
    container_name: ${APP_NAME:-app}-nginx
    ports:
      - "${DOCKER_BIND_ADDRESS:-127.0.0.1}:${NGINX_PORT:-80}:80"
    volumes:
      - ./public:/app/public
      - ./.docker/nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - app

  app:
    build:
      context: "./.docker/php"
      target: app
    container_name: ${APP_NAME:-app}-app
    working_dir: /app
    environment:
      DOCKER_BIND_ADDRESS: "${DOCKER_BIND_ADDRESS:-127.0.0.1}"
    volumes:
      - ".:/app"
      - "./.docker/php/php.ini:/usr/local/etc/php/conf.d/php.ini"
    stdin_open: true
    tty: true
    depends_on:
      - mariadb

  mariadb:
    image: mariadb:10.11
    container_name: ${APP_NAME:-app}-mariadb
    ports:
      - "${DOCKER_BIND_ADDRESS:-127.0.0.1}:${MARIADB_PORT:-3306}:3306"
    volumes:
      - "./storage/mariadb:/var/lib/mysql"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-app}
      MYSQL_ROOT_PASSWORD: password

  mariadb-testing:
    image: mariadb:10.11
    container_name: ${APP_NAME:-app}-mariadb-testing
    environment:
      # DB_DATABASE をリネームしてもテスト基盤が壊れないよう phpunit.xml と CI に揃えて固定。
      MYSQL_DATABASE: app_testing
      MYSQL_ROOT_PASSWORD: password

  mariadb-e2e:
    image: mariadb:10.11
    container_name: ${APP_NAME:-app}-mariadb-e2e
    environment:
      MYSQL_DATABASE: app_e2e
      MYSQL_ROOT_PASSWORD: password

  mailpit:
    image: axllent/mailpit
    container_name: ${APP_NAME:-app}-mailpit
    ports:
      - "${DOCKER_BIND_ADDRESS:-127.0.0.1}:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${DOCKER_BIND_ADDRESS:-127.0.0.1}:${MAILPIT_UI_PORT:-8025}:8025"
