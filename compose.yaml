services:
  nginx:
    build: "./.docker/nginx"
    container_name: ${APP_NAME:-app}-nginx
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./public:/app/public
      - ./.docker/nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - app

  app:
    build: "./.docker/php"
    container_name: ${APP_NAME:-app}-app
    working_dir: /app
    volumes:
      - ".:/app"
      - "./.docker/php/php.ini:/usr/local/etc/php/conf.d/php.ini"
    # stdin_openとttyで -it オプションと同じ意味を持つ
    stdin_open: true
    tty: true
    # mariadbを立ち上げてからwebを立ち上げる
    depends_on:
      - mariadb

  mariadb:
    image: mariadb:10.5
    container_name: ${APP_NAME:-app}-mariadb
    ports:
      - "${MARIADB_PORT:-3306}:3306"
    volumes:
      - "./storage/mariadb:/var/lib/mysql"
    # パスワードを設定しておかないと、MariaDBのコンテナがUpにならない
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-app}
      MYSQL_ROOT_PASSWORD: password

  mariadb-testing:
    image: mariadb:10.5
    container_name: ${APP_NAME:-app}-mariadb-testing
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-app}_testing
      MYSQL_ROOT_PASSWORD: password

  mailpit:
    image: axllent/mailpit
    container_name: ${APP_NAME:-app}-mailpit
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
