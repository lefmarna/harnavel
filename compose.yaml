# ローカル開発では loopback だけに公開する（config/app.php の trust_local_reverse_proxy の前提）。
services:
  nginx:
    image: nginx:stable
    ports:
      - "127.0.0.1:${NGINX_PORT}:80"
    volumes:
      - ./public:/app/public
      - ./.docker/nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - app

  app:
    build:
      context: "./.docker/php"
      target: app
    working_dir: /app
    environment:
      # テスト・E2E は開発 DB に触れない専用アカウントを使う（scripts/dev-environment.ts で作成）。
      TEST_DB_DATABASE: ${DB_DATABASE}_testing
      TEST_DB_USERNAME: ${DB_USERNAME}_test
      TEST_DB_PASSWORD: ${DB_PASSWORD}
      E2E_DB_DATABASE: ${DB_DATABASE}_e2e
      E2E_DB_USERNAME: ${DB_USERNAME}_e2e
      E2E_DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ".:/app"
      - "./.docker/php/php.ini:/usr/local/etc/php/conf.d/php.ini"
      - "composer-cache:/root/.composer/cache"
      # 追加 Worktree の .git は主 checkout の管理情報を絶対パスで指すため、同じパスで見せる。
      - "${DEV_GIT_COMMON_DIR:?mise run setup を実行してください}:${DEV_GIT_COMMON_DIR}"
    stdin_open: true
    tty: true
    networks:
      - default
      - backend

networks:
  backend:
    external: true
    name: ${DEV_INFRA_PROJECT:?mise run setup を実行してください}-backend

volumes:
  composer-cache:
    external: true
    name: ${DEV_INFRA_PROJECT}-composer-cache
