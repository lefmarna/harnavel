pre-commit:
  jobs:
    - name: generate wayfinder routes
      run: docker compose exec -T app php artisan wayfinder:generate --with-form
    - name: fix staged frontend files with eslint
      glob: '*.{js,jsx,ts,tsx}'
      run: pnpm exec eslint --fix {staged_files}
      stage_fixed: true
    - name: format staged frontend files
      glob: '*.{css,html,js,json,jsx,md,ts,tsx,yaml,yml}'
      run: pnpm exec prettier --write {staged_files}
      stage_fixed: true
    - name: format staged php files
      glob: '*.php'
      run: docker compose exec app vendor/bin/pint --format=agent {staged_files}
      stage_fixed: true
    - name: run checks
      group:
        parallel: true
        jobs:
          - name: lint frontend
            run: pnpm lint:check
          - name: type check frontend
            run: pnpm types:check
          - name: lint markdown links
            run: pnpm lint:docs
          - name: run backend analysis
            run: mise run analyse
