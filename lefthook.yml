pre-commit:
  jobs:
    - name: generate and format php
      group:
        parallel: true
        jobs:
          - name: generate wayfinder routes when vite is stopped
            glob: '*.php'
            run: |
              VITE_PORT="${VITE_PORT:-$(awk -F= '/^VITE_PORT=/{gsub(/"/, "", $2); print $2; exit}' .env 2>/dev/null)}"
              VITE_PORT="${VITE_PORT:-5173}"
              if ! curl -fsS "http://localhost:${VITE_PORT}/@vite/client" >/dev/null 2>&1; then
                mise run wayfinder
              fi
          - name: format staged php files
            glob: '*.php'
            run: docker compose exec -T app vendor/bin/pint --format=agent {staged_files}
            stage_fixed: true
    - name: fix staged frontend files with eslint
      glob: '*.{js,jsx,ts,tsx}'
      run: pnpm exec eslint --fix {staged_files}
      stage_fixed: true
    - name: format staged frontend files
      glob: '*.{css,html,js,json,jsx,ts,tsx,yaml,yml}'
      run: pnpm exec oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    - name: run checks
      group:
        parallel: true
        jobs:
          - name: lint frontend
            run: pnpm lint:check
          - name: type check frontend
            run: pnpm types:check
          - name: lint markdown links
            run: pnpm lint:docs
          - name: run backend analysis
            run: mise run analyse
