[tools]
node = "24.20.0"
pnpm = "12.2.1"

# depends は並列実行されるため、順序が要る処理は run で逐次に呼ぶ。
[tasks.setup]
description = "Setup entire project from scratch"
run = [
  "mise run setup:tools",
  "mise run setup:env",
  "mise run up",
  "mise run setup:backend",
  "node --import tsx scripts/dev-environment.ts initialize-app",
  "mise run assets",
]

[tasks."setup:tools"]
description = "Install development tools and frontend dependencies"
run = ["mise install", "pnpm install --frozen-lockfile"]

[tasks."setup:env"]
description = "Create local environment file if missing"
run = "node --import tsx scripts/dev-environment.ts env"

[tasks."setup:backend"]
description = "Setup backend (requires running containers)"
run = "node --import tsx scripts/dev-environment.ts backend"

[tasks.build]
description = "Build docker containers"
depends = ["setup:env"]
run = "docker compose build"

[tasks.up]
description = "Start docker containers"
run = "node --import tsx scripts/dev-environment.ts up"

[tasks.stop]
description = "Stop docker containers"
run = "docker compose stop"

[tasks.down]
description = "Remove this Worktree's containers (shared DB and cache are preserved)"
run = "docker compose down"

[tasks.assets]
description = "Build frontend assets and drop a hot file left by a stopped Vite"
run = [
  # 停止済みの Vite を指す public/hot が残ると、ビルド済みアセットが使われない。
  '[ ! -f public/hot ] || curl -gfsS -m 3 "$(cat public/hot)/@vite/client" >/dev/null 2>&1 || rm -f public/hot',
  "pnpm build",
]

[tasks."dev:info"]
description = "Show this Worktree's local URLs and database names"
run = "node --import tsx scripts/dev-environment.ts info"

[tasks."infra:stop"]
description = "Stop shared infrastructure after all Worktrees are down"
run = "node --import tsx scripts/dev-environment.ts infra-stop"

[tasks."worktree:remove"]
description = "Remove this extra Worktree's containers, DBs, users and port allocation"
run = "node --import tsx scripts/dev-environment.ts remove"

[tasks.ps]
description = "List docker containers"
run = "docker compose ps"

[tasks.logs]
description = "View app logs"
run = "docker compose logs -f app"

[tasks.app]
description = "Access app container"
run = "docker compose exec app bash"

[tasks.migrate]
description = "Run database migrations"
run = "docker compose exec app php artisan migrate"

[tasks.seed]
description = "Run database seeders"
run = "docker compose exec app php artisan db:seed"

[tasks.fresh]
description = "Fresh migration and seed"
run = "docker compose exec app php artisan migrate:fresh --seed"

[tasks.status]
description = "Migration status"
run = "docker compose exec app php artisan migrate:status"

[tasks.rollback]
description = "Rollback migration"
run = "docker compose exec app php artisan migrate:rollback"

[tasks.test]
description = "Run tests"
run = "docker compose exec app scripts/run-pest-locked.sh php artisan test $@"
raw = true

[tasks.mutate]
description = "Run mutation testing on the classes their specs declare with mutates()"
run = """
docker compose exec app mkdir -p vendor/pestphp/pest-plugin-mutate/.temp/mutations
docker compose exec app scripts/run-pest-locked.sh vendor/bin/pest --mutate --covered-only $@
"""
raw = true

[tasks.analyse]
description = "Run static analysis (Larastan/PHPStan)"
run = "docker compose exec app composer analyse"

[tasks.pint]
description = "Run Laravel Pint formatter on changed PHP files"
run = "docker compose exec app vendor/bin/pint --dirty --format=agent"

[tasks."verify:backend"]
description = "Run backend quality checks (Pint + Larastan + Pest with coverage)"
run = """
docker compose exec app vendor/bin/pint --dirty --format=agent && \
docker compose exec app composer analyse && \
docker compose exec app scripts/run-pest-locked.sh php artisan test --compact --coverage --min=90
"""

[tasks."verify:backend:full"]
description = "Run backend quality checks plus mutation testing and Chromium E2E"
run = ["mise run verify:backend", "mise run mutate --min=100", "pnpm test:e2e"]

[tasks."composer:install"]
description = "Composer install"
run = "docker compose exec app composer install"

[tasks."composer:update"]
description = "Composer update"
run = "docker compose exec app composer update"

[tasks.clear]
description = "Clear caches"
run = """
docker compose exec app bash -c "
  composer dump-autoload && \
  php artisan cache:clear && \
  php artisan config:clear && \
  php artisan route:clear && \
  php artisan view:clear"
"""

[tasks.route]
description = "List routes"
run = "docker compose exec app php artisan route:list"

[tasks.wayfinder]
description = "Generate Wayfinder TypeScript route/action helpers"
run = "docker compose exec -T app php artisan wayfinder:generate --with-form"
