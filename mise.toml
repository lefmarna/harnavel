[tools]
node = "24.13.1"
pnpm = "10.30.1"

# =============================================================================
# セットアップ関連
# =============================================================================

[tasks.setup]
description = "Setup entire project from scratch"
depends = ["setup:tools", "build", "up", "setup:backend", "migrate", "seed"]

[tasks."setup:tools"]
description = "Install development tools and frontend dependencies"
run = ["mise install", "pnpm install --frozen-lockfile"]

[tasks."setup:backend"]
description = "Setup backend (requires running containers)"
run = """
docker compose exec app bash -c "
  composer install --no-interaction && \
  php -r \"file_exists('.env') || copy('.env.example', '.env');\" && \
  php artisan key:generate"
"""

# =============================================================================
# Docker 関連
# =============================================================================

[tasks.build]
description = "Build docker containers"
run = "docker compose build --no-cache --force-rm"

[tasks.up]
description = "Start docker containers"
run = "docker compose up -d"

[tasks.stop]
description = "Stop docker containers"
run = "docker compose stop"

[tasks.down]
description = "Remove docker containers"
run = "docker compose down"

[tasks.restart]
description = "Restart docker containers"
depends = ["down", "up"]

[tasks.destroy]
description = "Destroy docker containers and volumes"
run = "docker compose down --rmi all --volumes"

[tasks.ps]
description = "List docker containers"
run = "docker compose ps"

[tasks.logs]
description = "View app logs"
run = "docker compose logs -f app"

[tasks.app]
description = "Access app container"
run = "docker compose exec app bash"

# =============================================================================
# PHP/Laravel 関連
# =============================================================================

[tasks.migrate]
description = "Run database migrations"
run = "docker compose exec app php artisan migrate"

[tasks.seed]
description = "Run database seeders"
run = "docker compose exec app php artisan db:seed"

[tasks.fresh]
description = "Fresh migration and seed"
run = "docker compose exec app php artisan migrate:fresh --seed"

[tasks.status]
description = "Migration status"
run = "docker compose exec app php artisan migrate:status"

[tasks.rollback]
description = "Rollback migration"
run = "docker compose exec app php artisan migrate:rollback"

[tasks.test]
description = "Run tests"
run = "docker compose exec app php artisan test $@"
raw = true

[tasks.analyse]
description = "Run static analysis (Larastan/PHPStan)"
run = "docker compose exec app composer analyse"

[tasks.pint]
description = "Run Laravel Pint formatter on changed PHP files"
run = "docker compose exec app vendor/bin/pint --dirty --format=agent"

[tasks."verify:backend"]
description = "Run backend quality checks (Pint + Larastan + Pest)"
run = """
docker compose exec app vendor/bin/pint --dirty --format=agent && \
docker compose exec app composer analyse && \
docker compose exec app php artisan test --compact
"""

[tasks."verify:backend:full"]
description = "Run backend quality checks plus Chromium E2E"
run = """
docker compose exec app vendor/bin/pint --dirty --format=agent && \
docker compose exec app composer analyse && \
docker compose exec app php artisan test --compact && \
pnpm test:e2e --project=chromium
"""

[tasks."composer:install"]
description = "Composer install"
run = "docker compose exec app composer install"

[tasks."composer:update"]
description = "Composer update"
run = "docker compose exec app composer update"

[tasks.clear]
description = "Clear caches"
run = """
docker compose exec app bash -c "
  composer dump-autoload && \
  php artisan cache:clear && \
  php artisan config:clear && \
  php artisan route:clear && \
  php artisan view:clear"
"""

[tasks.tinker]
description = "Run tinker"
run = "docker compose exec app php artisan tinker"

[tasks.route]
description = "List routes"
run = "docker compose exec app php artisan route:list"

# =============================================================================
# フロントエンド関連
# =============================================================================

[tasks.fix]
description = "Fix code (ESLint + Prettier)"
run = "pnpm fix"
quiet = true

# =============================================================================
# デプロイ関連
# =============================================================================

[tasks."deploy:build"]
description = "Build for production (frontend assets)"
run = "pnpm run build"

[tasks."deploy:package"]
description = "Create deployment package (excludes dev files)"
run = """
test -f public/build/manifest.json || { echo 'public/build/manifest.json is missing. Run `mise run deploy:build` first.' >&2; exit 1; } && \
rm -rf .deploy && mkdir -p .deploy && \
rsync -av --progress --exclude-from='.deployignore' ./ .deploy/ && \
echo '✅ Deployment package created in ./.deploy/'
"""

[tasks."deploy:prepare"]
description = "Full deployment preparation (build + package)"
depends = ["deploy:build", "deploy:package"]
