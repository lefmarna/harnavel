allowBuilds:
  esbuild: false
  lefthook: false
  unrs-resolver: false
packages:
  - "."

overrides:
  # Vite+ owns the Vite instance; a second copy splits the plugin type graph.
  vite@*: npm:@voidzero-dev/vite-plus-core@0.3.0
  brace-expansion@1: 1.1.18
  brace-expansion@5: 5.0.9
  nanoid@3: 3.3.18

publicHoistPattern:
  - "@inertiajs/core"
