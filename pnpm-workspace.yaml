allowBuilds:
  esbuild: false
  lefthook: false
  unrs-resolver: false
packages:
  - "."

overrides:
  # Vite の二重導入でプラグインの型が分裂しないよう、Vite+ のインスタンスに揃える。
  vite@*: npm:@voidzero-dev/vite-plus-core@0.3.0
  brace-expansion@1: 1.1.18
  brace-expansion@5: 5.0.9
  nanoid@3: 3.3.18
  # 親パッケージが脆弱な版を固定しているため、修正版へ寄せる。親の更新で解消したら消す。
  shell-quote@1: 1.11.0
  source-map-js@1: 1.2.2
  tinypool@2: 2.1.2

publicHoistPattern:
  - "@inertiajs/core"
